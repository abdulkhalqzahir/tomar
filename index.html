<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سیستەمی ژمێریاری و دارایی | چوونەژوورەوە</title>
  <style>
    /* Reset & Base */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, 'Vazirmatn', system-ui, -apple-system, sans-serif;
    }

    :root {
      --bg-dark: #07111a;
      --bg-card: rgba(13, 27, 42, 0.78);
      --primary: #10b981;
      --primary-hover: #059669;
      --primary-light: #34d399;
      --accent-gold: #f59e0b;
      --accent-cyan: #06b6d4;
      --border-color: rgba(52, 211, 153, 0.22);
      --border-focus: rgba(52, 211, 153, 0.65);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --error-color: #f43f5e;
      --error-bg: rgba(244, 63, 94, 0.12);
      --shadow-ambient: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 45px rgba(16, 185, 129, 0.15);
      --shadow-glow: 0 0 25px rgba(16, 185, 129, 0.35);
      --input-bg: rgba(8, 18, 28, 0.7);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(16, 185, 129, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(6, 182, 212, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(245, 158, 11, 0.05) 0%, transparent 60%);
      overflow-x: hidden;
      position: relative;
      padding: 20px;
    }

    /* Subtle Animated Accounting Grid Background */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      pointer-events: none;
      z-index: 0;
    }

    /* Floating Financial Ambient Elements */
    .floating-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      z-index: 1;
      opacity: 0.6;
      animation: floatSlow 14s infinite ease-in-out alternate;
    }

    .shape-1 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.35), transparent 70%);
      top: -80px;
      right: -60px;
      animation-duration: 16s;
    }

    .shape-2 {
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.28), transparent 70%);
      bottom: -60px;
      left: -50px;
      animation-duration: 18s;
      animation-delay: -5s;
    }

    .shape-3 {
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.2), transparent 70%);
      top: 60%;
      right: 15%;
      animation-duration: 22s;
      animation-delay: -9s;
    }

    /* Floating Accounting Icons */
    .floating-finance-icons {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .f-icon {
      position: absolute;
      color: rgba(52, 211, 153, 0.16);
      font-size: 26px;
      user-select: none;
      animation: driftIcon 20s infinite linear;
    }

    .f-icon.i1 { top: 12%; left: 10%; animation-duration: 26s; font-size: 30px; }
    .f-icon.i2 { top: 75%; left: 8%; animation-duration: 22s; animation-delay: -4s; font-size: 24px; color: rgba(245, 158, 11, 0.15); }
    .f-icon.i3 { top: 20%; right: 12%; animation-duration: 28s; animation-delay: -8s; font-size: 32px; }
    .f-icon.i4 { top: 70%; right: 10%; animation-duration: 24s; animation-delay: -12s; font-size: 28px; color: rgba(6, 182, 212, 0.18); }
    .f-icon.i5 { top: 45%; left: 3%; animation-duration: 30s; animation-delay: -16s; font-size: 22px; }

    @keyframes floatSlow {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, 40px) scale(1.08); }
      100% { transform: translate(-20px, -30px) scale(0.95); }
    }

    @keyframes driftIcon {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.2; }
      50% { transform: translateY(-30px) rotate(15deg); opacity: 0.45; }
      100% { transform: translateY(0) rotate(0deg); opacity: 0.2; }
    }

    /* Main Container */
    .login-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      perspective: 1000px;
    }

    /* Glassmorphic Accounting Card */
    .login-card {
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 42px 36px;
      box-shadow: var(--shadow-ambient);
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 200%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary-light), var(--accent-gold), transparent);
      animation: scanline 6s linear infinite;
    }

    @keyframes scanline {
      0% { transform: translateX(0); }
      100% { transform: translateX(50%); }
    }

    /* Card Header */
    .card-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-icon-wrapper {
      width: 76px;
      height: 76px;
      margin: 0 auto 16px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-icon-bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.25), rgba(6, 182, 212, 0.15));
      border: 1px solid rgba(52, 211, 153, 0.4);
      border-radius: 20px;
      transform: rotate(45deg);
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.35);
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: rotate(45deg) scale(1); box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.35); }
      100% { transform: rotate(45deg) scale(1.06); box-shadow: 0 12px 30px rgba(16, 185, 129, 0.55); }
    }

    .brand-icon-svg {
      position: relative;
      z-index: 2;
      width: 40px;
      height: 40px;
      color: #34d399;
      filter: drop-shadow(0 2px 6px rgba(16, 185, 129, 0.6));
    }

    .card-title {
      font-size: 23px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .title-gradient {
      background: linear-gradient(135deg, #f8fafc 30%, #34d399 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card-subtitle {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .accounting-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 8px;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.25);
      font-size: 12px;
      color: #34d399;
      font-weight: 600;
    }

    .tag-dot {
      width: 6px;
      height: 6px;
      background-color: #34d399;
      border-radius: 50%;
      box-shadow: 0 0 8px #34d399;
      animation: blink 2s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 22px;
      position: relative;
    }

    .field-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13.5px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    .field-label svg {
      width: 16px;
      height: 16px;
      color: #34d399;
    }

    .input-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-field {
      width: 100%;
      height: 52px;
      background: var(--input-bg);
      border: 1.5px solid rgba(52, 211, 153, 0.2);
      border-radius: 14px;
      padding: 0 16px 0 46px;
      color: var(--text-main);
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
    }

    .input-field::placeholder {
      color: var(--text-dim);
      font-size: 13.5px;
    }

    .input-field:focus {
      border-color: var(--primary-light);
      background: rgba(12, 26, 40, 0.95);
      box-shadow: 
        0 0 0 3px rgba(16, 185, 129, 0.22),
        0 8px 24px -4px rgba(0, 0, 0, 0.5),
        inset 0 1px 2px rgba(255, 255, 255, 0.05);
      transform: translateY(-1px);
    }

    .input-icon {
      position: absolute;
      left: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      transition: color 0.3s;
      pointer-events: none;
    }

    .input-field:focus ~ .input-icon {
      color: #34d399;
    }

    /* Password Toggle Button */
    .toggle-password {
      position: absolute;
      left: 14px;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.25s, transform 0.2s;
      outline: none;
      z-index: 2;
    }

    .toggle-password:hover {
      color: var(--primary-light);
      transform: scale(1.1);
    }

    /* Error Message Box */
    .error-container {
      display: none;
      align-items: center;
      gap: 10px;
      background: var(--error-bg);
      border: 1px solid rgba(244, 63, 94, 0.35);
      color: #fda4af;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 20px;
      animation: fadeInSlide 0.3s ease-out;
    }

    .error-container.show {
      display: flex;
    }

    .error-icon {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      color: var(--error-color);
    }

    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Shake Animation for Failed Login */
    .shake {
      animation: shakeForm 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
      border-color: var(--error-color) !important;
      box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.25), 0 0 25px rgba(244, 63, 94, 0.2) !important;
    }

    @keyframes shakeForm {
      10%, 90% { transform: translate3d(-3px, 0, 0); }
      20%, 80% { transform: translate3d(5px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    /* Submit Button with Luxurious Gradient and Hover Glow */
    .btn-login {
      position: relative;
      width: 100%;
      height: 52px;
      background: linear-gradient(135deg, #10b981 0%, #059669 50%, #047857 100%);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 25px -4px rgba(16, 185, 129, 0.45), 0 0 15px rgba(16, 185, 129, 0.25);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
      margin-top: 10px;
    }

    .btn-login::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
      transition: 0.5s;
    }

    .btn-login:hover {
      background: linear-gradient(135deg, #34d399 0%, #10b981 50%, #059669 100%);
      transform: translateY(-2px);
      box-shadow: 0 14px 30px -4px rgba(16, 185, 129, 0.65), 0 0 25px rgba(52, 211, 153, 0.35);
    }

    .btn-login:hover::after {
      left: 100%;
    }

    .btn-login:active {
      transform: translateY(1px) scale(0.99);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
    }

    .btn-icon {
      transition: transform 0.3s ease;
    }

    .btn-login:hover .btn-icon {
      transform: translateX(-4px);
    }

    /* Loading Spinner */
    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Credentials Info Box / Quick Fill Badge */
    .demo-credentials-box {
      margin-top: 26px;
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px dashed rgba(52, 211, 153, 0.25);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .cred-text {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .cred-highlight {
      color: #34d399;
      font-weight: 700;
      direction: ltr;
      display: inline-block;
    }

    .btn-autofill {
      background: rgba(52, 211, 153, 0.15);
      border: 1px solid rgba(52, 211, 153, 0.35);
      color: #34d399;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
      white-space: nowrap;
    }

    .btn-autofill:hover {
      background: rgba(52, 211, 153, 0.25);
      border-color: #34d399;
      transform: scale(1.03);
    }

    /* Success / Accounting Dashboard Preview Screen */
    .success-view {
      display: none;
      text-align: center;
      animation: zoomIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    .success-badge {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.25), rgba(16, 185, 129, 0.05));
      border: 2px solid #34d399;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.45);
      animation: pulseSuccess 2s infinite ease-in-out;
    }

    @keyframes pulseSuccess {
      0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(16, 185, 129, 0.45); }
      50% { transform: scale(1.06); box-shadow: 0 0 40px rgba(16, 185, 129, 0.65); }
    }

    .success-title {
      font-size: 22px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 6px;
    }

    .success-subtitle {
      font-size: 14px;
      color: #34d399;
      margin-bottom: 24px;
      font-weight: 600;
    }

    /* Mini Accounting Summary Cards */
    .dashboard-preview {
      background: rgba(9, 20, 31, 0.85);
      border: 1px solid rgba(52, 211, 153, 0.2);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 22px;
      text-align: right;
    }

    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }

    .preview-header span {
      font-size: 13px;
      color: var(--text-muted);
    }

    .status-pill {
      font-size: 11px;
      padding: 3px 8px;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(52, 211, 153, 0.4);
      color: #34d399;
      border-radius: 12px;
      font-weight: 600;
    }

    .kpi-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .kpi-card {
      background: rgba(15, 28, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 12px;
    }

    .kpi-title {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .kpi-value {
      font-size: 16px;
      font-weight: 700;
      color: #f8fafc;
    }

    .kpi-value.green {
      color: #34d399;
    }

    .kpi-value.gold {
      color: #fbbf24;
    }

    .btn-logout {
      width: 100%;
      height: 46px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-logout:hover {
      background: rgba(244, 63, 94, 0.15);
      border-color: rgba(244, 63, 94, 0.4);
      color: #fda4af;
    }

    /* Footer text */
    .system-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-dim);
    }
  </style>
</head>
<body>

  <!-- Background Decorative Grid -->
  <div class="bg-grid"></div>

  <!-- Ambient Blurred Glowing Orbs -->
  <div class="floating-shape shape-1"></div>
  <div class="floating-shape shape-2"></div>
  <div class="floating-shape shape-3"></div>

  <!-- Floating Financial Symbols -->
  <div class="floating-finance-icons">
    <div class="f-icon i1">📊</div>
    <div class="f-icon i2">⚖️</div>
    <div class="f-icon i3">💰</div>
    <div class="f-icon i4">📈</div>
    <div class="f-icon i5">🧮</div>
  </div>

  <!-- Login Container -->
  <div class="login-wrapper">
    <div class="login-card" id="loginCard">
      
      <!-- Login View -->
      <div id="loginView">
        <!-- Header -->
        <div class="card-header">
          <div class="brand-icon-wrapper">
            <div class="brand-icon-bg"></div>
            <!-- Accounting Balance Scale & Chart SVG -->
            <svg class="brand-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <!-- Scales of Justice / Balance for Accounting -->
              <path d="M12 3v17"></path>
              <path d="M5 7h14"></path>
              <path d="M6 7l-3 6a3 3 0 0 0 6 0L6 7z"></path>
              <path d="M18 7l-3 6a3 3 0 0 0 6 0L18 7z"></path>
              <path d="M8 21h8"></path>
            </svg>
          </div>
          <h1 class="card-title">
            <span class="title-gradient">سیستەمی ژمێریاری</span>
          </h1>
          <p class="card-subtitle">بەخێربێیت، تکایە بچۆ ژوورەوە بۆ ژمێرە و دارایی</p>
          <div class="accounting-tag">
            <span class="tag-dot"></span>
            <span>بڕوانامەی ئەمنی دارایی چالاکە</span>
          </div>
        </div>

        <!-- Error Notification -->
        <div class="error-container" id="errorBox">
          <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span id="errorMessage">ناوی بەکارهێنەر یان وشەی نهێنی هەڵەیە!</span>
        </div>

        <!-- Form -->
        <form id="loginForm" autocomplete="off" onsubmit="return handleLogin(event)">
          <!-- Username Field -->
          <div class="form-group">
            <label class="field-label" for="username">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <span>ناوی بەکارهێنەر</span>
            </label>
            <div class="input-box">
              <input 
                type="text" 
                id="username" 
                name="username"
                class="input-field" 
                placeholder="ناوی بەکارهێنەر بنووسە..."
                required
                autocomplete="username"
              >
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </span>
            </div>
          </div>

          <!-- Password Field -->
          <div class="form-group">
            <label class="field-label" for="password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <span>وشەی نهێنی</span>
            </label>
            <div class="input-box">
              <input 
                type="password" 
                id="password" 
                name="password"
                class="input-field" 
                placeholder="••••••••" 
                required
                autocomplete="current-password"
              >
              <!-- Toggle Visibility Eye Button -->
              <button type="button" class="toggle-password" id="togglePasswordBtn" onclick="togglePasswordVisibility()" title="پیشاندان / شاردنەوەی وشەی نهێنی">
                <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn-login" id="submitBtn">
            <span id="btnText">چوونەژوورەوە بۆ ژمێریاری</span>
            <div class="spinner" id="btnSpinner"></div>
            <svg class="btn-icon" id="btnIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <!-- RTL Left Arrow pointing into system -->
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
          </button>
        </form>

      </div>

      <!-- Success / Redirecting Screen -->
      <div id="successView" class="success-view">
        <div class="success-badge">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <h2 class="success-title">چوونەژوورەوە سەرکەوتوو بوو!</h2>
        <p class="success-subtitle" id="redirectMsg">دەچێتە سەر پەڕەی مەبەست...</p>
        <div style="margin-top: 20px; display: flex; justify-content: center;">
          <div class="spinner" style="display: block; width: 28px; height: 28px; border-width: 3px; border-top-color: #34d399;"></div>
        </div>
      </div>

    </div>

    <div class="system-footer">
      سیستەمی پارێزراوی ژمێریاری و دارایی 256-Bit SSL
    </div>
  </div>

  <script>
    // ==============================================================================
    // ⚙️ ڕێکخستنی ناوی فایلەکەت و زانیاری چوونەژوورەوە:
    // ==============================================================================

    // 📍 [لاینی 829]: ناوی ئەو فایلەی کە دەتەوێت دوای چوونەژوورەوە لێی بکرێتەوە:
    const TARGET_FILE = "zhmeryary.html"; // ناوی فایلەکەت لێرە دابنێ (وەک: dashboard.html)

    // 🔒 یوزەر و وشەی نهێنی بە شێوازی شاردراوە (Encoded) دانراون تا لە ناو کۆد دیار نەبن:
    // کۆدی 'YWJkdWxraGFscQ==' هاوتای بەکارهێنەرەکەتە
    // کۆدی 'MTIzNA==' هاوتای وشەی نهێنیەکەتە
    const SECRET_USER = "YWJkdWxraGFscQ=="; 
    const SECRET_PASS = "MTIzNA==";

    // ==============================================================================

    // DOM Elements
    const loginCard = document.getElementById('loginCard');
    const loginView = document.getElementById('loginView');
    const successView = document.getElementById('successView');
    const redirectMsg = document.getElementById('redirectMsg');
    const errorBox = document.getElementById('errorBox');
    const errorMessage = document.getElementById('errorMessage');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const btnIcon = document.getElementById('btnIcon');
    const eyeIcon = document.getElementById('eyeIcon');

    // Toggle Password Visibility
    function togglePasswordVisibility() {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
      } else {
        passwordInput.type = 'password';
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
      }
    }

    // پشکنینی دروستی یوزەر و وشەی نهێنی بە شێوازی شاردراوە
    function verifyCredential(input, secret) {
      if (!input || !secret) return false;
      try {
        return (btoa(input) === secret) || (input === secret) || (input === atob(secret));
      } catch (e) {
        return input === secret;
      }
    }

    // Hide error helper
    function hideError() {
      errorBox.classList.remove('show');
      loginCard.classList.remove('shake');
    }

    usernameInput.addEventListener('input', hideError);
    passwordInput.addEventListener('input', hideError);

    // Form Submission Handling
    function handleLogin(event) {
      event.preventDefault();
      hideError();

      const enteredUser = usernameInput.value.trim();
      const enteredPass = passwordInput.value;

      // Start Loading State
      submitBtn.disabled = true;
      btnText.style.display = 'none';
      btnIcon.style.display = 'none';
      btnSpinner.style.display = 'block';

      // پشکنینی زانیارییەکان
      setTimeout(() => {
        submitBtn.disabled = false;
        btnText.style.display = 'inline';
        btnIcon.style.display = 'inline';
        btnSpinner.style.display = 'none';

        const isUserValid = verifyCredential(enteredUser, SECRET_USER);
        const isPassValid = verifyCredential(enteredPass, SECRET_PASS);

        if (isUserValid && isPassValid) {
          // سەرکەوتوو بوو - گواستنەوە بۆ فایلی تۆمارکراو
          loginView.style.display = 'none';
          successView.style.display = 'block';
          redirectMsg.textContent = 'چوونەژوورەوە پەسەندکرا! دەچێتە سەر ' + TARGET_FILE;
          
          setTimeout(() => {
            window.location.href = TARGET_FILE;
          }, 800);
        } else {
          // Failure: Shake & Glow error
          loginCard.classList.add('shake');
          errorBox.classList.add('show');
          
          if (!isUserValid && !isPassValid) {
            errorMessage.textContent = 'ناوی بەکارهێنەر و وشەی نهێنی هەڵەن!';
          } else if (!isUserValid) {
            errorMessage.textContent = 'ناوی بەکارهێنەر نادروستە!';
          } else {
            errorMessage.textContent = 'وشەی نهێنی هەڵەیە!';
          }

          setTimeout(() => {
            loginCard.classList.remove('shake');
          }, 600);
        }
      }, 550);

      return false;
    }

    // Mouse 3D Subtle Tilt Effect
    document.addEventListener('mousemove', (e) => {
      const card = document.getElementById('loginCard');
      if (!card) return;
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left - rect.width / 2;
      const y = e.clientY - rect.top - rect.height / 2;
      const rotateX = -(y / rect.height) * 8;
      const rotateY = (x / rect.width) * 8;
      card.style.transform = `perspective(1000px) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg)`;
    });

    document.addEventListener('mouseleave', () => {
      const card = document.getElementById('loginCard');
      if (card) {
        card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
      }
    });
  </script>
</body>
</html>
