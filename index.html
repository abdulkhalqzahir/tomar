<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تایپ خێرا - ڕاهێنانی پیشەیی کیبۆرد</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #0a0e1a 0%, #141c36 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            direction: rtl;
        }

        .container {
            max-width: 960px;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 36px;
            padding: 28px 24px 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }

        .logo h1 {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6fcbff, #8b6fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo small {
            font-size: 0.75rem;
            color: #6a84b8;
            font-weight: 500;
            -webkit-text-fill-color: #6a84b8;
            display: block;
        }

        .badge-level {
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: rgba(255, 255, 255, 0.02);
        }
        .badge-level.beginner {
            color: #ff8a8a;
            border-color: rgba(255, 80, 80, 0.15);
        }
        .badge-level.intermediate {
            color: #ffd966;
            border-color: rgba(255, 200, 80, 0.15);
        }
        .badge-level.advanced {
            color: #7ae0a0;
            border-color: rgba(90, 255, 150, 0.15);
        }
        .badge-level.expert {
            color: #6fcbff;
            border-color: rgba(79, 200, 255, 0.15);
        }

        /* ===== STATS ===== */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background: rgba(0, 0, 0, 0.25);
            padding: 12px 16px;
            border-radius: 28px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }
        .stat-item {
            text-align: center;
        }
        .stat-number {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.2;
        }
        .stat-number.speed {
            color: #6fcbff;
        }
        .stat-number.accuracy {
            color: #7ae0a0;
        }
        .stat-number.time {
            color: #ffd966;
        }
        .stat-number.progress {
            color: #b38aff;
        }
        .stat-label {
            font-size: 0.65rem;
            font-weight: 500;
            color: #6a84b8;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-top: 2px;
        }

        /* ===== SENTENCE ===== */
        .sentence-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 20px 24px;
            margin-bottom: 14px;
            min-height: 100px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            box-shadow: inset 0 4px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
        }
        #sentenceDisplay {
            font-size: 1.3rem;
            line-height: 2.2rem;
            color: #dce6ff;
            font-weight: 400;
            letter-spacing: 0.3px;
            width: 100%;
            word-break: break-word;
        }
        #sentenceDisplay .correct {
            color: #7ae0a0;
            text-shadow: 0 0 16px rgba(90, 255, 150, 0.12);
        }
        #sentenceDisplay .wrong {
            color: #ff7a7a;
            background: rgba(255, 0, 0, 0.05);
            border-radius: 4px;
            padding: 0 2px;
            text-decoration: underline wavy #ff5e5e;
        }
        #sentenceDisplay .cursor {
            display: inline-block;
            width: 3px;
            height: 1.6rem;
            background: #6fcbff;
            margin-right: 2px;
            border-radius: 3px;
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
            box-shadow: 0 0 16px rgba(79, 122, 255, 0.2);
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        /* ===== KEYBOARD ===== */
        .keyboard-wrapper {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 20px;
            padding: 14px 12px 12px;
            margin: 12px 0 14px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            box-shadow: inset 0 2px 20px rgba(0, 0, 0, 0.2);
            user-select: none;
            overflow-x: auto;
        }

        .keyboard {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 600px;
            direction: ltr;
        }

        .kb-row {
            display: flex;
            gap: 5px;
            justify-content: center;
        }

        .key {
            min-width: 40px;
            height: 44px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #b3c7f0;
            font-size: 0.8rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: 'Inter', sans-serif;
            position: relative;
            padding: 0 6px;
            flex-shrink: 0;
        }

        .key.special {
            min-width: 55px;
            font-size: 0.65rem;
            color: #6a84b8;
        }
        .key.space {
            min-width: 200px;
            font-size: 0.7rem;
            color: #4a6a8a;
            letter-spacing: 2px;
        }
        .key.shift {
            min-width: 70px;
        }

        .key .finger {
            position: absolute;
            bottom: -18px;
            font-size: 0.5rem;
            color: #4a6a8a;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.7);
            padding: 0 6px;
            border-radius: 4px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .key:hover .finger {
            opacity: 1;
        }

        .key.active-key {
            background: #4f7aff;
            border-color: #4f7aff;
            color: #fff;
            box-shadow: 0 0 20px rgba(79, 122, 255, 0.3);
            transform: scale(0.92);
        }

        .key.active-key .finger {
            opacity: 1;
            color: #6fcbff;
        }

        .key.hit-correct {
            background: rgba(90, 255, 150, 0.15);
            border-color: rgba(90, 255, 150, 0.2);
            color: #7ae0a0;
        }

        .key.hit-wrong {
            background: rgba(255, 80, 80, 0.15);
            border-color: rgba(255, 80, 80, 0.2);
            color: #ff7a7a;
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-4px);
            }
            75% {
                transform: translateX(4px);
            }
        }

        .finger-LP {
            border-bottom: 2px solid #ff6b6b;
        }
        .finger-LR {
            border-bottom: 2px solid #ffa94d;
        }
        .finger-LM {
            border-bottom: 2px solid #ffd93d;
        }
        .finger-LI {
            border-bottom: 2px solid #6bcb6b;
        }
        .finger-LT {
            border-bottom: 2px solid #4dabf7;
        }
        .finger-RT {
            border-bottom: 2px solid #4dabf7;
        }
        .finger-RI {
            border-bottom: 2px solid #6bcb6b;
        }
        .finger-RM {
            border-bottom: 2px solid #ffd93d;
        }
        .finger-RR {
            border-bottom: 2px solid #ffa94d;
        }
        .finger-RP {
            border-bottom: 2px solid #ff6b6b;
        }

        /* ===== INPUT ===== */
        #userInput {
            width: 100%;
            padding: 16px 24px;
            font-size: 1.2rem;
            border-radius: 60px;
            border: 2px solid rgba(255, 255, 255, 0.04);
            background: rgba(0, 0, 0, 0.4);
            color: #f0f4ff;
            outline: none;
            transition: all 0.3s ease;
            direction: ltr;
            text-align: right;
            letter-spacing: 0.5px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
        }
        #userInput:focus {
            border-color: #4f7aff;
            box-shadow: 0 0 0 6px rgba(79, 122, 255, 0.08);
            background: rgba(0, 0, 0, 0.55);
        }
        #userInput::placeholder {
            color: #3e5a8a;
            font-weight: 400;
        }
        #userInput:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ===== BUTTONS ===== */
        .actions {
            display: flex;
            gap: 12px;
            margin-top: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 12px 32px;
            border-radius: 60px;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-start {
            background: linear-gradient(135deg, #4f7aff, #6b4fff);
            color: #fff;
            box-shadow: 0 6px 24px rgba(79, 122, 255, 0.25);
        }
        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 36px rgba(79, 122, 255, 0.35);
        }
        .btn-start:active {
            transform: scale(0.96);
        }
        .btn-reset {
            background: rgba(255, 120, 120, 0.06);
            color: #ffbcbc;
            border: 1px solid rgba(255, 120, 120, 0.08);
        }
        .btn-reset:hover {
            background: rgba(255, 80, 80, 0.12);
            border-color: rgba(255, 120, 120, 0.15);
        }

        /* ===== STATUS ===== */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }
        .status-text {
            color: #6a84b8;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .status-text strong {
            color: #b3c7f0;
        }

        .mode-btns {
            display: flex;
            gap: 4px;
        }
        .mode-btn {
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: transparent;
            color: #6a84b8;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }
        .mode-btn.active {
            background: #4f7aff;
            color: #fff;
            border-color: #4f7aff;
        }
        .mode-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.04);
            color: #b3c7f0;
        }

        .count-btns {
            display: flex;
            gap: 4px;
        }
        .count-btn {
            padding: 4px 10px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: transparent;
            color: #6a84b8;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }
        .count-btn.active {
            background: #2a3a6a;
            color: #fff;
            border-color: #2a3a6a;
        }
        .count-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.04);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 650px) {
            .container {
                padding: 16px 12px;
                border-radius: 24px;
            }
            .stats {
                grid-template-columns: repeat(2, 1fr);
                gap: 4px;
                padding: 10px 12px;
            }
            .stat-number {
                font-size: 1.2rem;
            }
            #sentenceDisplay {
                font-size: 1rem;
                line-height: 1.8rem;
            }
            #userInput {
                font-size: 1rem;
                padding: 14px 18px;
            }
            .key {
                min-width: 30px;
                height: 36px;
                font-size: 0.65rem;
            }
            .key.special {
                min-width: 40px;
                font-size: 0.55rem;
            }
            .key.space {
                min-width: 100px;
            }
            .key.shift {
                min-width: 50px;
            }
            .keyboard {
                min-width: 400px;
            }
            .btn {
                padding: 10px 22px;
                font-size: 0.85rem;
            }
            .key .finger {
                display: none;
            }
            .logo h1 {
                font-size: 1.3rem;
            }
            .status-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
            }
            .mode-btns,
            .count-btns {
                justify-content: center;
            }
        }

        @media (max-width: 450px) {
            .key {
                min-width: 24px;
                height: 30px;
                font-size: 0.55rem;
                padding: 0 3px;
            }
            .key.special {
                min-width: 32px;
                font-size: 0.5rem;
            }
            .key.space {
                min-width: 60px;
            }
            .keyboard {
                min-width: 300px;
            }
            #sentenceDisplay {
                font-size: 0.9rem;
                line-height: 1.6rem;
            }
            .sentence-box {
                padding: 14px 16px;
                min-height: 70px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div class="logo">
                <h1>⌨️عبدالخالق </h1>
                <h1>⌨️TEAM KHAWAN</h1>
                <small>ڕاهێنانی کیبۆرد بە شوێنی پەنجە</small>
            </div>
            <span class="badge-level beginner" id="levelBadge">⚡ ئاست: —</span>
        </div>

        <!-- STATS -->
        <div class="stats">
            <div class="stat-item">
                <div class="stat-number time" id="timerDisplay">0</div>
                <div class="stat-label">⏱️ کات</div>
            </div>
            <div class="stat-item">
                <div class="stat-number speed" id="speedDisplay">0</div>
                <div class="stat-label">⚡ WPM</div>
            </div>
            <div class="stat-item">
                <div class="stat-number accuracy" id="accuracyDisplay">100</div>
                <div class="stat-label">🎯 دروستی</div>
            </div>
            <div class="stat-item">
                <div class="stat-number progress" id="progressDisplay">0/0</div>
                <div class="stat-label">📌 پێشکەوتن</div>
            </div>
        </div>

        <!-- SENTENCE -->
        <div class="sentence-box">
            <div id="sentenceDisplay">
                <span>👆 کلیک لە «دەستپێکردن» بکە</span>
                <span class="cursor"></span>
            </div>
        </div>

        <!-- KEYBOARD -->
        <div class="keyboard-wrapper">
            <div class="keyboard" id="keyboard"></div>
        </div>

        <!-- INPUT -->
        <input type="text" id="userInput" placeholder="لێرە بنوسە ..." autocomplete="off" />

        <!-- ACTIONS -->
        <div class="actions">
            <button class="btn btn-start" id="startBtn">▶️ دەستپێکردن</button>
            <button class="btn btn-reset" id="resetBtn">🔄 دووبارە</button>
        </div>

        <!-- STATUS -->
        <div class="status-bar">
            <span class="status-text" id="statusText">📖 مۆدی وتە — <strong>٢٥</strong> وتە</span>
            <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
                <div class="mode-btns">
                    <button class="mode-btn active" data-mode="proverb">📖 وتە</button>
                    <button class="mode-btn" data-mode="story">📚 چیرۆک</button>
                </div>
                <div class="count-btns">
                    <button class="count-btn" data-count="10">١٠</button>
                    <button class="count-btn active" data-count="25">٢٥</button>
                    <button class="count-btn" data-count="35">٣٥</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ================================================================
            //  DATA — وتە و چیرۆکی درێژ و بەمانا
            // ================================================================

            const PROVERBS = [
                "هەوڵ بدە سەرکەوتن لەگەڵتە، چونکە بێ هەوڵ هیچ نابێت و ژیان بەفیڕۆ دەچێت",
                "زانیاری هێزە و خوێندن ڕووناکییە، بەڵام بیرکردنەوە پێشکەوتنە و گەشە دەهێنێت",
                "کات زێڕە، بە باشی بەکاری بهێنە بۆ دروستکردنی داهاتوویەکی گەش و پڕ لە سەربەخۆیی",
                "خوێندن ڕووناکییە، ڕووناکی ڕێگا دەدۆزێتەوە بۆ سەرکەوتن و ژیانی باشتر",
                "بە هەوڵی خۆت بگە بە مەبەست، هیچ کەس ناتوانێت شوێنی تۆ بگرێتەوە لەم ژیانەدا",
                "هەموو ڕێگە بۆ ڕۆما دەڕوات، بەڵام هەر کەس ڕێگای خۆی هەیە بۆ گەیشتن بە خەونەکان",
                "باشی بکە وەک ئاوی زەریا، بەردەوام و بێ تەنگە، چونکە باشی هەمیشە گەڕ دەگەڕێتەوە",
                "دەست بە کار بکە خودا یارمەتیت دەدات، بەوڵە نەکەوێتە خەمەوە، هەمیشە هیوا هەیە",
                "ئیمان دارە بە خۆت، چونکە تۆ توانای زۆرت هەیە کە نازانیت و دەتوانیت گەورە ببیت",
                "شەرمن نەبە لە فێربوون، هەر کەس هەڵە دەکات و لە هەڵەکانی خۆیەوە فێر دەبێت",
                "هەر ڕۆژێک هەوڵێکی نوێ، پێشکەوتن بچوک بەڵام بەردەوام دەبێتە گۆڕانکاری گەورە",
                "گوێ بۆ ڕێنمایی دەرباز، ڕێنمایی چرای ڕێگەی ژیانە و ڕێگا ڕوون دەکاتەوە",
                "وەک سێویک بە دەست بکە، بە ئارامی و بە دڵنیایی، بە خۆشەویستی و بە ڕێز",
                "خوا لەگەڵ خەڵکی ئاسانە، ئەگەر تۆش لەگەڵ خەڵکدا ئاسان بیت و ڕەوشت باش بێت",
                "زۆر خوێندن بیر روشن دەکات، و بیرکردنەوە دەریا دەکاتەوە بۆ ژیانی نوێ",
                "تێگەیشتن گەنجینەیە، کە خاوەنی خۆی دەوڵەمەند دەکات بە زانیاری و دانایی",
                "ڕێز بۆ باوک و دایک، ڕێز بناغەی هەموو ڕەوشتێکی چاکە و کۆمەڵگای پێشکەوتوو",
                "هاوکار باشترە لە تەنها، یەکێتی هێز دروست دەکات و کێشەکان چارەسەر دەکات",
                "هەموو شتێک کاتی خۆی هەیە، خەم بۆ کاتی ڕابردوو مەخۆ و چاوەڕوانی داهاتوو بە",
                "خەون ببینە بەڵام بە هەوڵ، خەون بەبێ هەوڵ وەک با تێدەپەڕێت و نامێنێت",
                "سەرکەوتن خەم ناگرێتەوە، بەڵکو ڕێگا دەدۆزێتەوە بۆ ئەوەی خەڵک پێشکەوتن بکات",
                "باشی بکە لەهەموو کات، چونکە باشی هەمیشە گەڕ دەگەڕێتەوە و جیهان باشتر دەکات",
                "دانایی لە هەلەکە، هەل هەر کەسێک نایبینێت، بەڵام دانا هەل دروست دەکات",
                "هەموو کێشە چارەسەری هەیە، تەنها پێویستە بیر بکەیتەوە و ڕێگای چارەسەر بدۆزیتەوە",
                "بێ تۆز نەمری، هەموو شتێک بە هەوڵ بەدەست دەهێنرێت و ژیان بە مانا دەبێت"
            ];

            const STORIES = [
                "لە ڕۆژێکی خۆش و پڕ لە تیشکی خۆردا، کوڕێکی گەنج بە ناوی زانیار لە گوندێکی شاخاوی ژیان دەکرد. ئەو هەمیشە خەونی ئەوەی دەبینی کە کتێبخانەیەک لە گوندەکەیان دروست بکات، چونکە باوەڕی وابوو کە خوێندن و زانست دەتوانێت ژیانی خەڵک بگۆڕێت و ڕووناکی بە ژیانیاندا بڵاو بکاتەوە. بۆیە هەموو پارەکەی کۆکردەوە و کتێبەکانی کڕی و ماڵەکەی کردە کتێبخانە. دوای ساڵێک، کتێبخانەکە بووە شوێنی کۆبوونەوەی هەموو کەسێک کە حەزی لە فێربوونە. ئەم چیرۆکە فێری ئەوە دەکات کە خەونەکان بە هەوڵ و بەردەوامی دەبنە ڕاستی، و خوێندن دەرگای ژیانی باشترە.",

                "لە شارێکی کۆن و مێژووییدا، پیاوێکی پیر کتێبخانەیەکی گەورەی هەبوو. ئەو هەموو ڕۆژێک کتێبەکانی بۆ منداڵان دەخوێندەوە و چیرۆکی پێیان دەگوت. منداڵان حەزیان لە گوێگرتن بوو و فێری زۆر شتیان دەبوو. پیاوە پیرەکە پێی دەگووت: «کتێب باشترین هاوڕێیە، چونکە هەرگیز خیانەت ناکات و هەمیشە ڕێگا دەدۆزێتەوە». ئەم چیرۆکە فێری ئەوە دەکات کە خوێندن دەروازەیەکە بۆ جیهانی نوێ و بیرکردنەوەی باشتر و ژیانی پڕ لە مانا.",

                "دوو هاوڕێی دڵسۆز بە ناوەکانی کاروان و بارام، بڕیاریاندا کە قوتابخانەیەک لە گوندەکەیان دروست بکەن بۆ منداڵانی هەژار. خەڵک پێیان دەکەنی و دەیانگوت کە ئەم خەونە گەورەیە، بەڵام ئەوان وازیان نەهێنا و بەردەوام بوون. دوای ساڵێک، قوتابخانەکە کرایەوە و زۆر منداڵ لێی فێربوون و ژیانیان گۆڕا. ئەمە نیشانەی ئەوەیە کە خەونە گەورەکان بە هەوڵی بەردەوام دەبنە ڕاستی و کاریگەری گەورە دەکەن لە کۆمەڵگا.",

                "کچێکی گەنج و بەهرەمەند بە ناوی ڕووناک، حەزی لە زانست و توێژینەوە بوو. بڕیاریدا کە تاقیگەیەکی بچووک لە ماڵەکەی دروست بکات و توێژینەوە بکات. هەموو ڕۆژێک تاقیکردنەوەی دەکرد و شتی نوێ فێردەبوو. دوای چەند ساڵێک، بووە زانایەکی ناسراو و کاریگەری گەورەی لەسەر کۆمەڵگا دروست کرد و چارەسەری زۆر کێشەی دۆزییەوە. ئەم چیرۆکە فێری ئەوە دەکات کە خوێندن و توێژینەوە دەتوانێت ژیانی خەڵک بگۆڕێت و جیهان باشتر بکات."
            ];

            // ================================================================
            //  DOM REFS
            // ================================================================

            const sentenceDisplay = document.getElementById('sentenceDisplay');
            const userInput = document.getElementById('userInput');
            const timerDisplay = document.getElementById('timerDisplay');
            const speedDisplay = document.getElementById('speedDisplay');
            const accuracyDisplay = document.getElementById('accuracyDisplay');
            const progressDisplay = document.getElementById('progressDisplay');
            const statusText = document.getElementById('statusText');
            const levelBadge = document.getElementById('levelBadge');
            const startBtn = document.getElementById('startBtn');
            const resetBtn = document.getElementById('resetBtn');
            const modeBtns = document.querySelectorAll('.mode-btn');
            const countBtns = document.querySelectorAll('.count-btn');
            const keyboardEl = document.getElementById('keyboard');

            // ================================================================
            //  STATE
            // ================================================================

            let currentMode = 'proverb';
            let maxCount = 25;
            let activeList = [];
            let currentSentence = '';
            let sentenceIndex = 0;
            let charIndex = 0;

            let isActive = false;
            let startTime = null;
            let timerInterval = null;

            let totalCharsTyped = 0;
            let correctCharsTyped = 0;

            // ================================================================
            //  BUILD KEYBOARD
            // ================================================================

            function buildKeyboard() {
                keyboardEl.innerHTML = '';
                KEYBOARD_ROWS.forEach(row => {
                    const rowDiv = document.createElement('div');
                    rowDiv.className = 'kb-row';

                    row.forEach(k => {
                        const keyDiv = document.createElement('div');
                        keyDiv.className = 'key';
                        keyDiv.dataset.key = k.key;

                        if (k.special) keyDiv.classList.add('special');
                        if (k.space) keyDiv.classList.add('space');

                        if (k.finger) {
                            keyDiv.classList.add(`finger-${k.finger}`);
                            const fingerSpan = document.createElement('span');
                            fingerSpan.className = 'finger';
                            const fingerNames = {
                                'LP': 'پەنجە بچوک (چەپ)',
                                'LR': 'پەنجە ئەڵقە (چەپ)',
                                'LM': 'پەنجە ناوەڕاست (چەپ)',
                                'LI': 'پەنجە ئاماژە (چەپ)',
                                'LT': 'پەنجە گەورە (چەپ)',
                                'RT': 'پەنجە گەورە (ڕاست)',
                                'RI': 'پەنجە ئاماژە (ڕاست)',
                                'RM': 'پەنجە ناوەڕاست (ڕاست)',
                                'RR': 'پەنجە ئەڵقە (ڕاست)',
                                'RP': 'پەنجە بچوک (ڕاست)'
                            };
                            fingerSpan.textContent = fingerNames[k.finger] || k.finger;
                            keyDiv.appendChild(fingerSpan);
                        }

                        const display = k.key === 'Space' ? '⎵' : k.key;
                        keyDiv.textContent = display;
                        rowDiv.appendChild(keyDiv);
                    });

                    keyboardEl.appendChild(rowDiv);
                });
            }

            // ================================================================
            //  HELPERS
            // ================================================================

            function getFullList() {
                return currentMode === 'proverb' ? PROVERBS : STORIES;
            }

            function buildActiveList() {
                const full = getFullList();
                activeList = full.slice(0, Math.min(maxCount, full.length));
                if (activeList.length === 0) activeList = ['هیچ وتەیەک نیە'];
                return activeList;
            }

            function getModeLabel() {
                return currentMode === 'proverb' ? 'وتە' : 'چیرۆک';
            }

            function getLevelFromWPM(wpm) {
                if (wpm < 10) return { label: 'دەستپێک', cls: 'beginner' };
                if (wpm < 20) return { label: 'مامناوەند', cls: 'intermediate' };
                if (wpm < 35) return { label: 'باش', cls: 'advanced' };
                return { label: 'پیشەیی 🔥', cls: 'expert' };
            }

            // ================================================================
            //  RENDER
            // ================================================================

            function renderSentence() {
                if (!currentSentence) {
                    sentenceDisplay.innerHTML =
                        `<span>هیچ وتەیەک نیە</span><span class="cursor"></span>`;
                    return;
                }

                const chars = currentSentence.split('');
                let html = '';

                for (let i = 0; i < chars.length; i++) {
                    if (i < charIndex) {
                        html += `<span data-idx="${i}">${chars[i]}</span>`;
                    } else if (i === charIndex) {
                        html += `<span data-idx="${i}">${chars[i]}</span><span class="cursor"></span>`;
                    } else {
                        html += `<span data-idx="${i}">${chars[i]}</span>`;
                    }
                }

                if (charIndex >= chars.length) {
                    html += `<span class="cursor"></span>`;
                }

                sentenceDisplay.innerHTML = html;
                applyStyles();
            }

            function applyStyles() {
                const input = userInput.value;
                const chars = currentSentence.split('');
                const spans = sentenceDisplay.querySelectorAll('span[data-idx]');

                spans.forEach(span => {
                    span.classList.remove('correct', 'wrong');
                });

                for (let i = 0; i < input.length && i < chars.length; i++) {
                    const span = sentenceDisplay.querySelector(`span[data-idx="${i}"]`);
                    if (!span) continue;
                    if (input[i] === chars[i]) {
                        span.classList.add('correct');
                    } else {
                        span.classList.add('wrong');
                    }
                }
            }

            function updateStats() {
                const elapsed = startTime ? (Date.now() - startTime) / 1000 : 0;
                timerDisplay.textContent = Math.floor(elapsed);

                if (elapsed > 0 && correctCharsTyped > 0) {
                    const minutes = elapsed / 60;
                    const wpm = Math.round((correctCharsTyped / 5) / minutes);
                    speedDisplay.textContent = wpm;

                    const level = getLevelFromWPM(wpm);
                    levelBadge.textContent = `⚡ ئاست: ${level.label}`;
                    levelBadge.className = `badge-level ${level.cls}`;
                } else {
                    speedDisplay.textContent = '0';
                }

                if (totalCharsTyped > 0) {
                    const acc = Math.round((correctCharsTyped / totalCharsTyped) * 100);
                    accuracyDisplay.textContent = acc;
                } else {
                    accuracyDisplay.textContent = '100';
                }

                const total = activeList.length;
                const current = Math.min(sentenceIndex + 1, total);
                progressDisplay.textContent = `${current}/${total}`;
            }

            function updateStatus() {
                const label = getModeLabel();
                const count = activeList.length;
                statusText.innerHTML = `📖 مۆدی ${label} — <strong>${count}</strong> ${currentMode === 'proverb' ? 'وتە' : 'بەش'}`;
            }

            // ================================================================
            //  KEYBOARD HIGHLIGHT
            // ================================================================

            function highlightKey(char) {
                const allKeys = keyboardEl.querySelectorAll('.key');
                allKeys.forEach(k => {
                    k.classList.remove('active-key', 'hit-correct', 'hit-wrong');
                });

                if (!char) return;

                let found = null;
                allKeys.forEach(k => {
                    const keyText = k.dataset.key;
                    if (keyText && keyText.toLowerCase() === char.toLowerCase()) {
                        found = k;
                    }
                    if (char === ' ' && k.dataset.key === 'Space') {
                        found = k;
                    }
                });

                if (found) {
                    found.classList.add('active-key');
                }
            }

            function markHit(char, isCorrect) {
                const allKeys = keyboardEl.querySelectorAll('.key');
                let found = null;
                allKeys.forEach(k => {
                    const keyText = k.dataset.key;
                    if (keyText && keyText.toLowerCase() === char.toLowerCase()) {
                        found = k;
                    }
                    if (char === ' ' && k.dataset.key === 'Space') {
                        found = k;
                    }
                });

                if (found) {
                    found.classList.remove('active-key');
                    if (isCorrect) {
                        found.classList.add('hit-correct');
                        setTimeout(() => found.classList.remove('hit-correct'), 300);
                    } else {
                        found.classList.add('hit-wrong');
                        setTimeout(() => found.classList.remove('hit-wrong'), 400);
                    }
                }
            }

            // ================================================================
            //  GAME LOGIC
            // ================================================================

            function loadSentence(index) {
                if (index >= activeList.length) {
                    finishGame();
                    return;
                }

                sentenceIndex = index;
                currentSentence = activeList[index];
                charIndex = 0;
                totalCharsTyped = 0;
                correctCharsTyped = 0;

                userInput.value = '';
                userInput.disabled = false;
                renderSentence();
                updateStats();
                updateStatus();
                highlightKey('');
            }

            function finishGame() {
                stopTimer();
                isActive = false;
                userInput.disabled = true;
                sentenceDisplay.innerHTML = `
                    <span style="color: #7ae0a0; font-weight: 600; font-size: 1.6rem;">
                        🎉 پیرۆز! هەموو ${getModeLabel()}کان تەواو بوون!
                    </span>
                    <span class="cursor"></span>
                `;
                statusText.innerHTML = '🏁 تەواو! دووبارە دەستپێبکە';
                levelBadge.textContent = '🎯 تەواو!';
                levelBadge.className = 'badge-level expert';
                updateStats();
                highlightKey('');
            }

            function startGame() {
                if (isActive) return;

                buildActiveList();
                if (activeList.length === 0) return;

                if (sentenceIndex >= activeList.length) {
                    sentenceIndex = 0;
                }

                if (!currentSentence || sentenceIndex >= activeList.length) {
                    loadSentence(0);
                }

                isActive = true;
                userInput.disabled = false;
                userInput.value = '';
                userInput.focus();

                totalCharsTyped = 0;
                correctCharsTyped = 0;
                charIndex = 0;

                currentSentence = activeList[sentenceIndex];
                renderSentence();
                startTimer();
                updateStats();
                updateStatus();
                highlightKey('');

                levelBadge.textContent = '⚡ ئاست: —';
                levelBadge.className = 'badge-level beginner';
            }

            function resetGame() {
                stopTimer();
                isActive = false;
                startTime = null;

                buildActiveList();
                if (activeList.length === 0) activeList = ['هیچ وتەیەک نیە'];

                sentenceIndex = 0;
                loadSentence(0);

                userInput.disabled = false;
                userInput.value = '';
                timerDisplay.textContent = '0';
                speedDisplay.textContent = '0';
                accuracyDisplay.textContent = '100';
                progressDisplay.textContent = `1/${activeList.length}`;
                levelBadge.textContent = '⚡ ئاست: —';
                levelBadge.className = 'badge-level beginner';
                updateStatus();
                highlightKey('');
                userInput.focus();
            }

            // ================================================================
            //  TIMER
            // ================================================================

            function startTimer() {
                if (timerInterval) stopTimer();
                startTime = Date.now();
                timerInterval = setInterval(() => {
                    if (startTime) updateStats();
                }, 200);
            }

            function stopTimer() {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
                startTime = null;
            }

            // ================================================================
            //  INPUT HANDLER
            // ================================================================

            function handleInput(e) {
                if (!isActive) {
                    startGame();
                    if (!isActive) return;
                }

                const input = userInput.value;
                const chars = currentSentence.split('');
                const typedLen = Math.min(input.length, chars.length);

                const lastChar = input.length > 0 ? input[input.length - 1] : '';
                if (lastChar) {
                    const idx = input.length - 1;
                    if (idx < chars.length) {
                        const isCorrect = lastChar === chars[idx];
                        markHit(lastChar, isCorrect);
                    }
                }

                totalCharsTyped = typedLen;

                let correctCount = 0;
                for (let i = 0; i < typedLen; i++) {
                    if (input[i] === chars[i]) correctCount++;
                }
                correctCharsTyped = correctCount;

                charIndex = Math.min(input.length, chars.length);

                renderSentence();
                updateStats();

                if (charIndex < chars.length) {
                    highlightKey(chars[charIndex]);
                } else {
                    highlightKey('');
                }

                if (input.length >= chars.length && correctCount === chars.length) {
                    setTimeout(() => {
                        if (sentenceIndex + 1 < activeList.length) {
                            loadSentence(sentenceIndex + 1);
                            if (isActive) userInput.focus();
                        } else {
                            finishGame();
                        }
                    }, 400);
                }
            }

            // ================================================================
            //  MODE / COUNT CHANGE
            // ================================================================

            function setMode(mode) {
                if (mode === currentMode) return;
                currentMode = mode;

                modeBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.mode === mode);
                });

                resetGame();
            }

            function setCount(count) {
                if (count === maxCount) return;
                maxCount = count;

                countBtns.forEach(btn => {
                    btn.classList.toggle('active', parseInt(btn.dataset.count) === count);
                });

                resetGame();
            }

            // ================================================================
            //  EVENT LISTENERS
            // ================================================================

            userInput.addEventListener('input', handleInput);
            startBtn.addEventListener('click', startGame);
            resetBtn.addEventListener('click', resetGame);

            modeBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    setMode(this.dataset.mode);
                });
            });

            countBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    setCount(parseInt(this.dataset.count));
                });
            });

            keyboardEl.addEventListener('click', function() {
                userInput.focus();
            });

            // ================================================================
            //  INIT
            // ================================================================

            function init() {
                buildKeyboard();
                buildActiveList();
                if (activeList.length === 0) activeList = ['بەخێربێیت!'];
                loadSentence(0);
                updateStatus();
                levelBadge.textContent = '⚡ ئاست: —';
                levelBadge.className = 'badge-level beginner';
                userInput.focus();

                if (currentSentence && currentSentence.length > 0) {
                    setTimeout(() => highlightKey(currentSentence[0]), 300);
                }

                console.log('⌨️ کیبۆردی ڤێرتوالی ئامادەیە!');
                console.log('📚 ژمارەی وتە/چیرۆک: ٢٥ وتە و ١٠ چیرۆکی درێژ');
                console.log('💡 وانەکانی ژیان، سڵاش، فاریزە، ڕەوشت، و ڕێنمایی');
            }

            init();

        })();
    </script>

</body>
