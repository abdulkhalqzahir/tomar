<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تایپ خێرا - وتە، چیرۆک و تاپۆ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Naskh Arabic', 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #0a0e1a 0%, #1a1f38 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            direction: rtl;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 36px;
            padding: 28px 24px 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }

        .logo h1 {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6fcbff, #8b6fff, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo small {
            font-size: 0.7rem;
            color: #8a9bc0;
            font-weight: 500;
            -webkit-text-fill-color: #8a9bc0;
            display: block;
        }

        .badge-level {
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: rgba(255, 255, 255, 0.02);
            font-family: 'Inter', sans-serif;
        }
        .badge-level.beginner {
            color: #ff8a8a;
            border-color: rgba(255, 80, 80, 0.15);
        }
        .badge-level.intermediate {
            color: #ffd966;
            border-color: rgba(255, 200, 80, 0.15);
        }
        .badge-level.advanced {
            color: #7ae0a0;
            border-color: rgba(90, 255, 150, 0.15);
        }
        .badge-level.expert {
            color: #6fcbff;
            border-color: rgba(79, 200, 255, 0.15);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            background: rgba(0, 0, 0, 0.25);
            padding: 10px 14px;
            border-radius: 28px;
            margin-bottom: 14px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }
        .stat-item {
            text-align: center;
        }
        .stat-number {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.2;
        }
        .stat-number.speed {
            color: #fbbf24;
        }
        .stat-number.accuracy {
            color: #7ae0a0;
        }
        .stat-number.time {
            color: #6fcbff;
        }
        .stat-number.progress {
            color: #b38aff;
        }
        .stat-number.correct {
            color: #34d399;
        }
        .stat-label {
            font-size: 0.6rem;
            font-weight: 500;
            color: #6a84b8;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-top: 2px;
        }

        .sentence-box {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 20px;
            padding: 18px 22px;
            margin-bottom: 14px;
            min-height: 100px;
            border: 2px solid rgba(251, 191, 36, 0.06);
            box-shadow: inset 0 4px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
        }
        #sentenceDisplay {
            font-size: 1.3rem;
            line-height: 2.2rem;
            color: #e8edff;
            font-weight: 400;
            letter-spacing: 0.5px;
            width: 100%;
            word-break: break-word;
            font-family: 'Noto Naskh Arabic', 'Inter', sans-serif;
        }
        #sentenceDisplay .correct {
            color: #34d399;
            text-shadow: 0 0 16px rgba(52, 211, 153, 0.15);
        }
        #sentenceDisplay .wrong {
            color: #ff7a7a;
            background: rgba(255, 0, 0, 0.06);
            border-radius: 4px;
            padding: 0 2px;
            text-decoration: underline wavy #ff5e5e;
        }
        #sentenceDisplay .cursor {
            display: inline-block;
            width: 3px;
            height: 1.8rem;
            background: #fbbf24;
            margin-right: 2px;
            border-radius: 3px;
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
            box-shadow: 0 0 16px rgba(251, 191, 36, 0.2);
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        .keyboard-wrapper {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 20px;
            padding: 12px 10px 10px;
            margin: 10px 0 12px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            box-shadow: inset 0 2px 20px rgba(0, 0, 0, 0.2);
            user-select: none;
            overflow-x: auto;
        }

        .keyboard {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 600px;
            direction: ltr;
        }

        .kb-row {
            display: flex;
            gap: 4px;
            justify-content: center;
        }

        .key {
            min-width: 38px;
            height: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            color: #b3c7f0;
            font-size: 0.75rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: 'Inter', 'Noto Naskh Arabic', sans-serif;
            position: relative;
            padding: 0 4px;
            flex-shrink: 0;
        }

        .key.special {
            min-width: 50px;
            font-size: 0.6rem;
            color: #6a84b8;
        }
        .key.space {
            min-width: 160px;
            font-size: 0.65rem;
            color: #4a6a8a;
            letter-spacing: 2px;
        }

        .key .finger {
            position: absolute;
            bottom: -16px;
            font-size: 0.45rem;
            color: #4a6a8a;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.7);
            padding: 0 4px;
            border-radius: 4px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .key:hover .finger {
            opacity: 1;
        }

        .key.active-key {
            background: #fbbf24;
            border-color: #fbbf24;
            color: #0a0e1a;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
            transform: scale(0.92);
        }
        .key.hit-correct {
            background: rgba(52, 211, 153, 0.2);
            border-color: rgba(52, 211, 153, 0.2);
            color: #34d399;
        }
        .key.hit-wrong {
            background: rgba(255, 80, 80, 0.15);
            border-color: rgba(255, 80, 80, 0.2);
            color: #ff7a7a;
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-4px);
            }
            75% {
                transform: translateX(4px);
            }
        }

        .finger-LP {
            border-bottom: 2px solid #ff6b6b;
        }
        .finger-LR {
            border-bottom: 2px solid #ffa94d;
        }
        .finger-LM {
            border-bottom: 2px solid #ffd93d;
        }
        .finger-LI {
            border-bottom: 2px solid #6bcb6b;
        }
        .finger-LT {
            border-bottom: 2px solid #4dabf7;
        }
        .finger-RT {
            border-bottom: 2px solid #4dabf7;
        }
        .finger-RI {
            border-bottom: 2px solid #6bcb6b;
        }
        .finger-RM {
            border-bottom: 2px solid #ffd93d;
        }
        .finger-RR {
            border-bottom: 2px solid #ffa94d;
        }
        .finger-RP {
            border-bottom: 2px solid #ff6b6b;
        }

        #userInput {
            width: 100%;
            padding: 16px 24px;
            font-size: 1.2rem;
            border-radius: 60px;
            border: 2px solid rgba(251, 191, 36, 0.08);
            background: rgba(0, 0, 0, 0.4);
            color: #f0f4ff;
            outline: none;
            transition: all 0.3s ease;
            direction: ltr;
            text-align: right;
            letter-spacing: 0.5px;
            font-weight: 500;
            font-family: 'Noto Naskh Arabic', 'Inter', sans-serif;
        }
        #userInput:focus {
            border-color: #fbbf24;
            box-shadow: 0 0 0 6px rgba(251, 191, 36, 0.08);
            background: rgba(0, 0, 0, 0.55);
        }
        #userInput::placeholder {
            color: #3e5a8a;
            font-weight: 400;
        }
        #userInput:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 12px 32px;
            border-radius: 60px;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-start {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0a0e1a;
            box-shadow: 0 6px 24px rgba(251, 191, 36, 0.2);
        }
        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 36px rgba(251, 191, 36, 0.3);
        }
        .btn-start:active {
            transform: scale(0.96);
        }
        .btn-reset {
            background: rgba(255, 120, 120, 0.06);
            color: #ffbcbc;
            border: 1px solid rgba(255, 120, 120, 0.08);
        }
        .btn-reset:hover {
            background: rgba(255, 80, 80, 0.12);
            border-color: rgba(255, 120, 120, 0.15);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }
        .status-text {
            color: #6a84b8;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .status-text strong {
            color: #fbbf24;
        }

        .mode-btns {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .mode-btn {
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: transparent;
            color: #6a84b8;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }
        .mode-btn.active {
            background: #fbbf24;
            color: #0a0e1a;
            border-color: #fbbf24;
        }
        .mode-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.04);
            color: #b3c7f0;
        }

        .count-btns {
            display: flex;
            gap: 4px;
        }
        .count-btn {
            padding: 4px 10px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: transparent;
            color: #6a84b8;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }
        .count-btn.active {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
            border-color: rgba(251, 191, 36, 0.15);
        }
        .count-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.04);
        }

        .level-message {
            text-align: center;
            margin-top: 10px;
            padding: 12px 20px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.1rem;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(251, 191, 36, 0.1);
            display: none;
            font-family: 'Inter', sans-serif;
        }
        .level-message.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        .level-message .msg-beginner {
            color: #ff8a8a;
        }
        .level-message .msg-intermediate {
            color: #ffd966;
        }
        .level-message .msg-advanced {
            color: #7ae0a0;
        }
        .level-message .msg-expert {
            color: #6fcbff;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== Sub-mode for Tapoo ===== */
        .sub-mode-btns {
            display: flex;
            gap: 4px;
        }
        .sub-mode-btn {
            padding: 2px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: transparent;
            color: #6a84b8;
            font-size: 0.65rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }
        .sub-mode-btn.active {
            background: rgba(251, 191, 36, 0.12);
            color: #fbbf24;
            border-color: rgba(251, 191, 36, 0.12);
        }
        .sub-mode-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.04);
        }

        @media (max-width: 650px) {
            .container {
                padding: 16px 12px;
                border-radius: 24px;
            }
            .stats {
                grid-template-columns: repeat(3, 1fr);
                gap: 4px;
                padding: 10px 12px;
            }
            .stat-number {
                font-size: 1.1rem;
            }
            #sentenceDisplay {
                font-size: 1rem;
                line-height: 1.8rem;
            }
            #userInput {
                font-size: 1rem;
                padding: 14px 18px;
            }
            .key {
                min-width: 28px;
                height: 34px;
                font-size: 0.6rem;
            }
            .key.special {
                min-width: 36px;
                font-size: 0.5rem;
            }
            .key.space {
                min-width: 80px;
            }
            .keyboard {
                min-width: 400px;
            }
            .btn {
                padding: 10px 22px;
                font-size: 0.85rem;
            }
            .key .finger {
                display: none;
            }
            .logo h1 {
                font-size: 1.2rem;
            }
            .status-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
            }
            .mode-btns,
            .count-btns {
                justify-content: center;
            }
        }

        @media (max-width: 450px) {
            .key {
                min-width: 22px;
                height: 28px;
                font-size: 0.5rem;
                padding: 0 2px;
            }
            .key.special {
                min-width: 28px;
                font-size: 0.45rem;
            }
            .key.space {
                min-width: 50px;
            }
            .keyboard {
                min-width: 280px;
            }
            #sentenceDisplay {
                font-size: 0.85rem;
                line-height: 1.5rem;
            }
            .sentence-box {
                padding: 12px 14px;
                min-height: 60px;
            }
            .stats {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div class="logo">
                <h1>⌨️ تایپ خێرا</h1>
                <small>وتە · چیرۆک · تاپۆ</small>
            </div>
            <span class="badge-level beginner" id="levelBadge">⚡ ئاست: —</span>
        </div>

        <!-- STATS -->
        <div class="stats">
            <div class="stat-item">
                <div class="stat-number time" id="timerDisplay">0</div>
                <div class="stat-label">⏱️ کات</div>
            </div>
            <div class="stat-item">
                <div class="stat-number speed" id="speedDisplay">0</div>
                <div class="stat-label">⚡ WPM</div>
            </div>
            <div class="stat-item">
                <div class="stat-number accuracy" id="accuracyDisplay">100</div>
                <div class="stat-label">🎯 دروستی</div>
            </div>
            <div class="stat-item">
                <div class="stat-number progress" id="progressDisplay">0/0</div>
                <div class="stat-label">📌 پێشکەوتن</div>
            </div>
            <div class="stat-item">
                <div class="stat-number correct" id="correctDisplay">0</div>
                <div class="stat-label">✅ دروست</div>
            </div>
        </div>

        <!-- SENTENCE -->
        <div class="sentence-box">
            <div id="sentenceDisplay">
                <span>👆 کلیک لە «دەستپێکردن» بکە</span>
                <span class="cursor"></span>
            </div>
        </div>

        <!-- KEYBOARD -->
        <div class="keyboard-wrapper">
            <div class="keyboard" id="keyboard"></div>
        </div>

        <!-- INPUT -->
        <input type="text" id="userInput" placeholder="لێرە بنوسە ..." autocomplete="off" />

        <!-- ACTIONS -->
        <div class="actions">
            <button class="btn btn-start" id="startBtn">▶️ دەستپێکردن</button>
            <button class="btn btn-reset" id="resetBtn">🔄 دووبارە</button>
        </div>

        <!-- LEVEL MESSAGE -->
        <div class="level-message" id="levelMessage">
            <span id="levelMessageText"></span>
        </div>

        <!-- STATUS -->
        <div class="status-bar">
            <span class="status-text" id="statusText">📖 مۆدی وتە — <strong>١٠</strong></span>
            <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
                <div class="mode-btns">
                    <button class="mode-btn active" data-mode="proverb">📖 وتە</button>
                    <button class="mode-btn" data-mode="story">📚 چیرۆک</button>
                    <button class="mode-btn" data-mode="tapoo">📜 تاپۆ</button>
                </div>
                <div class="sub-mode-btns" id="subModeContainer" style="display:none;">
                    <button class="sub-mode-btn active" data-submode="short">کورت</button>
                    <button class="sub-mode-btn" data-submode="long">درێژ</button>
                    <button class="sub-mode-btn" data-submode="mixed">تێکەڵ</button>
                </div>
                <div class="count-btns">
                    <button class="count-btn active" data-count="10">١٠</button>
                    <button class="count-btn" data-count="25">٢٥</button>
                    <button class="count-btn" data-count="50">٥٠</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ================================================================
            //  DATA — وتە · چیرۆک · تاپۆ (کورت + درێژ)
            // ================================================================

            // ---------- وتە (پەندی بەناوبانگ) ----------
            const PROVERBS = [
                "هەوڵ بدە سەرکەوتن لەگەڵتە، چونکە بێ هەوڵ ژیان بەفیڕۆ دەچێت",
                "زانیاری هێزە و خوێندن ڕووناکییە، بیرکردنەوە پێشکەوتنە",
                "کات زێڕە، بە باشی بەکاری بهێنە بۆ داهاتوویەکی گەش",
                "خوێندن ڕووناکییە، ڕووناکی ڕێگا دەدۆزێتەوە بۆ سەرکەوتن",
                "بە هەوڵی خۆت بگە بە مەبەست، هیچ کەس شوێنی تۆ ناگرێتەوە",
                "باشی بکە وەک ئاوی زەریا، بەردەوام و بێ تەنگە",
                "دەست بە کار بکە خودا یارمەتیت دەدات، بەوڵە نەکەوێتە خەمەوە",
                "ئیمان دارە بە خۆت، چونکە تۆ توانای زۆرت هەیە",
                "شەرمن نەبە لە فێربوون، هەر کەس لە هەڵەکانی خۆیەوە فێر دەبێت",
                "هەر ڕۆژێک هەوڵێکی نوێ، پێشکەوتن بچوک دەبێتە گۆڕانکاری گەورە",
                "گوێ بۆ ڕێنمایی دەرباز، ڕێنمایی چرای ڕێگەی ژیانە",
                "وەک سێویک بە دەست بکە، بە ئارامی و بە دڵنیایی",
                "خوا لەگەڵ خەڵکی ئاسانە، ئەگەر تۆش لەگەڵ خەڵکدا ئاسان بیت",
                "زۆر خوێندن بیر روشن دەکات، بیرکردنەوە دەریا دەکاتەوە",
                "تێگەیشتن گەنجینەیە، خاوەنی خۆی دەوڵەمەند دەکات",
                "ڕێز بۆ باوک و دایک، ڕێز بناغەی هەموو ڕەوشتێکی چاکە",
                "هاوکار باشترە لە تەنها، یەکێتی هێز دروست دەکات",

                    { key: '0', finger: 'RR' },
                    { key: '-', finger: 'RR' },
                    { key: '=', finger: 'RP' },
                    { key: 'Backspace', finger: 'RP', special: true }
                ],
                [
                    { key: 'Tab', finger: 'LP', special: true },
                    { key: 'ض', finger: 'LP' },
                    { key: 'ص', finger: 'LR' },
                    { key: 'ث', finger: 'LM' },
                    { key: 'ق', finger: 'LI' },
                    { key: 'ف', finger: 'LI' },
                    { key: 'غ', finger: 'RT' },
                    { key: 'ع', finger: 'RT' },
                    { key: 'ه', finger: 'RI' },
                    { key: 'خ', finger: 'RM' },
                    { key: 'ح', finger: 'RR' },
                    { key: 'ج', finger: 'RP' },
                    { key: 'د', finger: 'RP' },
                    { key: '\\', finger: 'RP', special: true }
                ],
                [
                    { key: 'Caps', finger: 'LP', special: true },
                    { key: 'ش', finger: 'LP' },
                    { key: 'س', finger: 'LR' },
                    { key: 'ي', finger: 'LM' },
                    { key: 'ب', finger: 'LI' },
                    { key: 'ل', finger: 'LI' },
                    { key: 'ا', finger: 'RT' },
                    { key: 'ت', finger: 'RT' },
                    { key: 'ن', finger: 'RI' },
                    { key: 'م', finger: 'RM' },
                    { key: 'ك', finger: 'RR' },
                    { key: 'ط', finger: 'RP' },
                    { key: 'Enter', finger: 'RP', special: true }
                ],
                [
                    { key: 'Shift', finger: 'LP', special: true },
                    { key: 'ئ', finger: 'LP' },
                    { key: 'ء', finger: 'LR' },
                    { key: 'ؤ', finger: 'LM' },
                    { key: 'ر', finger: 'LI' },
                    { key: 'ى', finger: 'LI' },
                    { key: 'ة', finger: 'RT' },
                    { key: 'و', finger: 'RT' },
                    { key: 'ز', finger: 'RI' },
                    { key: 'ظ', finger: 'RM' },
                    { key: 'ذ', finger: 'RR' },
                    { key: 'Shift', finger: 'RP', special: true }
                ],
                [
                    { key: 'Ctrl', finger: 'LP', special: true },
                    { key: 'Fn', finger: 'LP', special: true },
                    { key: 'Alt', finger: 'LP', special: true },
                    { key: 'Space', finger: 'LP', special: true, space: true },
                    { key: 'Alt', finger: 'RP', special: true },
                    { key: 'Fn', finger: 'RP', special: true },
                    { key: 'Ctrl', finger: 'RP', special: true }
                ]
            ];

            // ================================================================
            //  DOM REFS
            // ================================================================

            const sentenceDisplay = document.getElementById('sentenceDisplay');
            const userInput = document.getElementById('userInput');
            const timerDisplay = document.getElementById('timerDisplay');
            const speedDisplay = document.getElementById('speedDisplay');
            const accuracyDisplay = document.getElementById('accuracyDisplay');
            const progressDisplay = document.getElementById('progressDisplay');
            const correctDisplay = document.getElementById('correctDisplay');
            const statusText = document.getElementById('statusText');
            const levelBadge = document.getElementById('levelBadge');
            const levelMessage = document.getElementById('levelMessage');
            const levelMessageText = document.getElementById('levelMessageText');
            const startBtn = document.getElementById('startBtn');
            const resetBtn = document.getElementById('resetBtn');
            const modeBtns = document.querySelectorAll('.mode-btn');
            const countBtns = document.querySelectorAll('.count-btn');
            const subModeBtns = document.querySelectorAll('.sub-mode-btn');
            const subModeContainer = document.getElementById('subModeContainer');
            const keyboardEl = document.getElementById('keyboard');

            // ================================================================
            //  STATE
            // ================================================================

            let currentMode = 'proverb';
            let currentSubMode = 'mixed'; // short, long, mixed
            let maxCount = 10;
            let activeList = [];
            let currentSentence = '';
            let sentenceIndex = 0;
            let charIndex = 0;

            let isActive = false;
            let startTime = null;
            let timerInterval = null;

            let totalCharsTyped = 0;
            let correctCharsTyped = 0;

            // ================================================================
            //  BUILD KEYBOARD
            // ================================================================

            function buildKeyboard() {
                keyboardEl.innerHTML = '';
                KEYBOARD_ROWS.forEach(row => {
                    const rowDiv = document.createElement('div');
                    rowDiv.className = 'kb-row';

                    row.forEach(k => {
                        const keyDiv = document.createElement('div');
                        keyDiv.className = 'key';
                        keyDiv.dataset.key = k.key;

                        if (k.special) keyDiv.classList.add('special');
                        if (k.space) keyDiv.classList.add('space');

                        if (k.finger) {
                            keyDiv.classList.add(`finger-${k.finger}`);
                            const fingerSpan = document.createElement('span');
                            fingerSpan.className = 'finger';
                            const fingerNames = {
                                'LP': 'پەنجە بچوک (چەپ)',
                                'LR': 'پەنجە ئەڵقە (چەپ)',
                                'LM': 'پەنجە ناوەڕاست (چەپ)',
                                'LI': 'پەنجە ئاماژە (چەپ)',
                                'LT': 'پەنجە گەورە (چەپ)',
                                'RT': 'پەنجە گەورە (ڕاست)',
                                'RI': 'پەنجە ئاماژە (ڕاست)',
                                'RM': 'پەنجە ناوەڕاست (ڕاست)',
                                'RR': 'پەنجە ئەڵقە (ڕاست)',
                                'RP': 'پەنجە بچوک (ڕاست)'
                            };
                            fingerSpan.textContent = fingerNames[k.finger] || k.finger;
                            keyDiv.appendChild(fingerSpan);
                        }

                        const display = k.key === 'Space' ? '⎵' : k.key;
                        keyDiv.textContent = display;
                        rowDiv.appendChild(keyDiv);
                    });

                    keyboardEl.appendChild(rowDiv);
                });
            }

            // ================================================================
            //  HELPERS
            // ================================================================

            function getFullList() {
                if (currentMode === 'proverb') return PROVERBS;
                if (currentMode === 'story') return STORIES;
                
                // Tapoo mode
                if (currentSubMode === 'short') return TAPOO_SHORT;
                if (currentSubMode === 'long') return TAPOO_LONG;
                // Mixed: combine both
                const combined = [];
                const maxLen = Math.max(TAPOO_SHORT.length, TAPOO_LONG.length);
                for (let i = 0; i < maxLen; i++) {
                    if (i < TAPOO_SHORT.length) combined.push(TAPOO_SHORT[i]);
                    if (i < TAPOO_LONG.length) combined.push(TAPOO_LONG[i]);
                }
                return combined;
            }

            function buildActiveList() {
                const full = getFullList();
                activeList = full.slice(0, Math.min(maxCount, full.length));
                if (activeList.length === 0) activeList = ['هیچ بەڵگەیەک نیە'];
                return activeList;
            }

            function getModeLabel() {
                if (currentMode === 'proverb') return 'وتە';
                if (currentMode === 'story') return 'چیرۆک';
                return 'تاپۆ';
            }

            function getModeEmoji() {
                if (currentMode === 'proverb') return '📖';
                if (currentMode === 'story') return '📚';
                return '📜';
            }

            function getSubModeLabel() {
                if (currentSubMode === 'short') return 'کورت';
                if (currentSubMode === 'long') return 'درێژ';
                return 'تێکەڵ';
            }

            function getLevelFromWPM(wpm, accuracy) {
                if (wpm < 8) return { label: 'دەستپێک', cls: 'beginner', msg: 'دەستپێک — پێویستە زیاتر ڕاهێنان بکەیت' };
                if (wpm < 15) return { label: 'مامناوەند', cls: 'intermediate', msg: 'مامناوەند — باشە بەڵام دەتوانیت باشتر بیت' };
                if (wpm < 25) return { label: 'باش', cls: 'advanced', msg: 'باش — ئاستێکی چاک' };
                return { label: 'پیشەیی 🔥', cls: 'expert', msg: 'پیشەیی — زۆر خێرا و ورد' };
            }

            // ================================================================
            //  RENDER
            // ================================================================

            function renderSentence() {
                if (!currentSentence) {
                    sentenceDisplay.innerHTML =
                        `<span>هیچ بەڵگەیەک نیە</span><span class="cursor"></span>`;
                    return;
                }

                const chars = currentSentence.split('');
                let html = '';

                for (let i = 0; i < chars.length; i++) {
                    if (i < charIndex) {
                        html += `<span data-idx="${i}">${chars[i]}</span>`;
                    } else if (i === charIndex) {
                        html += `<span data-idx="${i}">${chars[i]}</span><span class="cursor"></span>`;
                    } else {
                        html += `<span data-idx="${i}">${chars[i]}</span>`;
                    }
                }

                if (charIndex >= chars.length) {
                    html += `<span class="cursor"></span>`;
                }

                sentenceDisplay.innerHTML = html;
                applyStyles();
            }

            function applyStyles() {
                const input = userInput.value;
                const chars = currentSentence.split('');
                const spans = sentenceDisplay.querySelectorAll('span[data-idx]');

                spans.forEach(span => {
                    span.classList.remove('correct', 'wrong');
                });

                for (let i = 0; i < input.length && i < chars.length; i++) {
                    const span = sentenceDisplay.querySelector(`span[data-idx="${i}"]`);
                    if (!span) continue;
                    if (input[i] === chars[i]) {
                        span.classList.add('correct');
                    } else {
                        span.classList.add('wrong');
                    }
                }
            }

            function updateStats() {
                const elapsed = startTime ? (Date.now() - startTime) / 1000 : 0;
                timerDisplay.textContent = Math.floor(elapsed);

                if (elapsed > 0 && correctCharsTyped > 0) {
                    const minutes = elapsed / 60;
                    const wpm = Math.round((correctCharsTyped / 5) / minutes);
                    speedDisplay.textContent = wpm;

                    const level = getLevelFromWPM(wpm, 0);
                    levelBadge.textContent = `⚡ ئاست: ${level.label}`;
                    levelBadge.className = `badge-level ${level.cls}`;
                } else {
                    speedDisplay.textContent = '0';
                }

                if (totalCharsTyped > 0) {
                    const acc = Math.round((correctCharsTyped / totalCharsTyped) * 100);
                    accuracyDisplay.textContent = acc;
                } else {
                    accuracyDisplay.textContent = '100';
                }

                const total = activeList.length;
                const current = Math.min(sentenceIndex + 1, total);
                progressDisplay.textContent = `${current}/${total}`;
                correctDisplay.textContent = correctCharsTyped;
            }

            function updateStatus() {
                const label = getModeLabel();
                const emoji = getModeEmoji();
                const count = activeList.length;
                let extra = '';
                if (currentMode === 'tapoo') {
                    extra = ` (${getSubModeLabel()})`;
                }
                statusText.innerHTML = `${emoji} مۆدی ${label}${extra} — <strong>${count}</strong>`;
            }

            // ================================================================
            //  KEYBOARD HIGHLIGHT
            // ================================================================

            function highlightKey(char) {
                const allKeys = keyboardEl.querySelectorAll('.key');
                allKeys.forEach(k => {
                    k.classList.remove('active-key', 'hit-correct', 'hit-wrong');
                });

                if (!char) return;

                let found = null;
                allKeys.forEach(k => {
                    const keyText = k.dataset.key;
                    if (keyText && keyText.toLowerCase() === char.toLowerCase()) {
                        found = k;
                    }
                    if (char === ' ' && k.dataset.key === 'Space') {
                        found = k;
                    }
                    if (keyText === char) {
                        found = k;
                    }
                });

                if (found) {
                    found.classList.add('active-key');
                }
            }

            function markHit(char, isCorrect) {
                const allKeys = keyboardEl.querySelectorAll('.key');
                let found = null;
                allKeys.forEach(k => {
                    const keyText = k.dataset.key;
                    if (keyText && keyText.toLowerCase() === char.toLowerCase()) {
                        found = k;
                    }
                    if (char === ' ' && k.dataset.key === 'Space') {
                        found = k;
                    }
                    if (keyText === char) {
                        found = k;
                    }
                });

                if (found) {
                    found.classList.remove('active-key');
                    if (isCorrect) {
                        found.classList.add('hit-correct');
                        setTimeout(() => found.classList.remove('hit-correct'), 300);
                    } else {
                        found.classList.add('hit-wrong');
                        setTimeout(() => found.classList.remove('hit-wrong'), 400);
                    }
                }
            }

            // ================================================================
            //  GAME LOGIC
            // ================================================================

            function loadSentence(index) {
                if (index >= activeList.length) {
                    finishGame();
                    return;
                }

                sentenceIndex = index;
                currentSentence = activeList[index];
                charIndex = 0;
                totalCharsTyped = 0;
                correctCharsTyped = 0;

                userInput.value = '';
                userInput.disabled = false;
                renderSentence();
                updateStats();
                updateStatus();
                highlightKey('');
                levelMessage.classList.remove('show');
            }

            function finishGame() {
                stopTimer();
                isActive = false;
                userInput.disabled = true;

                const wpm = parseInt(speedDisplay.textContent) || 0;
                const accuracy = parseInt(accuracyDisplay.textContent) || 0;
                const level = getLevelFromWPM(wpm, accuracy);

                const modeEmoji = getModeEmoji();
                const modeLabel = getModeLabel();

                sentenceDisplay.innerHTML = `
                    <span style="color: #fbbf24; font-weight: 600; font-size: 1.6rem;">
                        🎉 تەواو! ${activeList.length} ${modeLabel} تەواو بوون!
                    </span>
                    <span class="cursor"></span>
                `;

                levelMessage.classList.add('show');
                levelMessageText.innerHTML = `
                    <span class="msg-${level.cls}">
                        🏆 ئاستەکەت: ${level.msg} 
                        (WPM: ${wpm} | دروستی: ${accuracy}%)
                    </span>
                `;

                statusText.innerHTML = '🏁 تەواو! دووبارە دەستپێبکە';
                levelBadge.textContent = `⚡ ئاست: ${level.label}`;
                levelBadge.className = `badge-level ${level.cls}`;
                updateStats();
                highlightKey('');
            }

            function startGame() {
                if (isActive) return;

                buildActiveList();
                if (activeList.length === 0) return;

                if (sentenceIndex >= activeList.length) {
                    sentenceIndex = 0;
                }

                if (!currentSentence || sentenceIndex >= activeList.length) {
                    loadSentence(0);
                }

                isActive = true;
                userInput.disabled = false;
                userInput.value = '';
                userInput.focus();

                totalCharsTyped = 0;
                correctCharsTyped = 0;
                charIndex = 0;

                currentSentence = activeList[sentenceIndex];
                renderSentence();
                startTimer();
                updateStats();
                updateStatus();
                highlightKey('');
                levelMessage.classList.remove('show');

                levelBadge.textContent = '⚡ ئاست: —';
                levelBadge.className = 'badge-level beginner';
            }

            function resetGame() {
                stopTimer();
                isActive = false;
                startTime = null;

                buildActiveList();
                if (activeList.length === 0) activeList = ['هیچ بەڵگەیەک نیە'];

                sentenceIndex = 0;
                loadSentence(0);

                userInput.disabled = false;
                userInput.value = '';
                timerDisplay.textContent = '0';
                speedDisplay.textContent = '0';
                accuracyDisplay.textContent = '100';
                progressDisplay.textContent = `1/${activeList.length}`;
                correctDisplay.textContent = '0';
                levelBadge.textContent = '⚡ ئاست: —';
                levelBadge.className = 'badge-level beginner';
                levelMessage.classList.remove('show');
                updateStatus();
                highlightKey('');
                userInput.focus();
            }

            // ================================================================
            //  TIMER
            // ================================================================

            function startTimer() {
                if (timerInterval) stopTimer();
                startTime = Date.now();
                timerInterval = setInterval(() => {
                    if (startTime) updateStats();
                }, 200);
            }

            function stopTimer() {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
                startTime = null;
            }

            // ================================================================
            //  INPUT HANDLER
            // ================================================================

            function handleInput(e) {
                if (!isActive) {
                    startGame();
                    if (!isActive) return;
                }

                const input = userInput.value;
                const chars = currentSentence.split('');
                const typedLen = Math.min(input.length, chars.length);

                const lastChar = input.length > 0 ? input[input.length - 1] : '';
                if (lastChar) {
                    const idx = input.length - 1;
                    if (idx < chars.length) {
                        const isCorrect = lastChar === chars[idx];
                        markHit(lastChar, isCorrect);
                    }
                }

                totalCharsTyped = typedLen;

                let correctCount = 0;
                for (let i = 0; i < typedLen; i++) {
                    if (input[i] === chars[i]) correctCount++;
                }
                correctCharsTyped = correctCount;

                charIndex = Math.min(input.length, chars.length);

                renderSentence();
                updateStats();

                if (charIndex < chars.length) {
                    highlightKey(chars[charIndex]);
                } else {
                    highlightKey('');
                }

                if (input.length >= chars.length && correctCount === chars.length) {
                    setTimeout(() => {
                        if (sentenceIndex + 1 < activeList.length) {
                            loadSentence(sentenceIndex + 1);
                            if (isActive) userInput.focus();
                        } else {
                            finishGame();
                        }
                    }, 400);
                }
            }

            // ================================================================
            //  MODE / COUNT / SUBMODE CHANGE
            // ================================================================

            function setMode(mode) {
                if (mode === currentMode) return;
                currentMode = mode;

                modeBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.mode === mode);
                });

                // Show/hide sub-mode buttons for Tapoo
                if (mode === 'tapoo') {
                    subModeContainer.style.display = 'flex';
                } else {
                    subModeContainer.style.display = 'none';
                }

                resetGame();
            }

            function setSubMode(submode) {
                if (submode === currentSubMode) return;
                currentSubMode = submode;

                subModeBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.submode === submode);
                });

                resetGame();
            }

            function setCount(count) {
                if (count === maxCount) return;
                maxCount = count;

                countBtns.forEach(btn => {
                    btn.classList.toggle('active', parseInt(btn.dataset.count) === count);
                });

                resetGame();
            }

            // ================================================================
            //  EVENT LISTENERS
            // ================================================================

            userInput.addEventListener('input', handleInput);
            startBtn.addEventListener('click', startGame);
            resetBtn.addEventListener('click', resetGame);

            modeBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    setMode(this.dataset.mode);
                });
            });

            subModeBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    setSubMode(this.dataset.submode);
                });
            });

            countBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    setCount(parseInt(this.dataset.count));
                });
            });

            keyboardEl.addEventListener('click', function() {
                userInput.focus();
            });

            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.key === 'Enter') {
                    e.preventDefault();
                    startGame();
                }
                if (e.key === 'Escape') {
                    resetGame();
                }
            });

            // ================================================================
            //  INIT
            // ================================================================

            function init() {
                buildKeyboard();
                
                // Hide sub-mode initially
                subModeContainer.style.display = 'none';
                
                buildActiveList();
                if (activeList.length === 0) activeList = ['بەخێربێیت!'];
                loadSentence(0);
                updateStatus();
                levelBadge.textContent = '⚡ ئاست: —';
                levelBadge.className = 'badge-level beginner';
                userInput.focus();

                if (currentSentence && currentSentence.length > 0) {
                    setTimeout(() => highlightKey(currentSentence[0]), 300);
                }

                console.log('⌨️ تایپ خێرا - وتە · چیرۆک · تاپۆ');
                console.log(`📚 ${activeList.length} بەڵگە ئامادەیە`);
                console.log('💡 Ctrl+Enter = دەستپێکردن | Esc = دووبارە');
                console.log('📜 تاپۆ: کورت (تەنها ناو و ژمارە) | درێژ (بەڵگەی تەواو) | تێکەڵ');
            }

            init();

        })();
    </script>

</body>
</html>
