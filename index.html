<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⚔️ABDULKHALQ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Naskh Arabic', 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #0a0e1a 0%, #1a0a0a 50%, #0f0a1a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            direction: rtl;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ff6b6b, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,200,100,0.8), transparent),
                radial-gradient(2px 2px at 50px 160px, #ff4444, transparent);
            background-size: 200px 200px;
            opacity: 0.1;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 880px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 24px 24px 20px;
            border: 1px solid rgba(255, 100, 100, 0.08);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8);
            position: relative;
            z-index: 1;
        }

        /* ===== HEADER ===== */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
        }

        .logo h1 {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ff6b6b, #ff4444, #cc0000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo small {
            font-size: 0.65rem;
            color: #8a6b6b;
            font-weight: 500;
            -webkit-text-fill-color: #8a6b6b;
            display: block;
        }

        .score-board {
            display: flex;
            gap: 12px;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 14px;
            border-radius: 60px;
            border: 1px solid rgba(255, 100, 100, 0.08);
            flex-wrap: wrap;
        }
        .score-item {
            text-align: center;
            padding: 0 3px;
        }
        .score-number {
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
        }
        .score-number.gold { color: #ffd700; }
        .score-number.green { color: #34d399; }
        .score-number.blue { color: #6fcbff; }
        .score-number.pink { color: #ff6b6b; }
        .score-number.purple { color: #a78bfa; }
        .score-label {
            font-size: 0.5rem;
            font-weight: 600;
            color: #8a6b6b;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* ===== CHARACTER AREA (بە گەورەیی) ===== */
        .character-area {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 30px;
            padding: 30px 20px 20px;
            margin-bottom: 12px;
            border: 2px solid rgba(255, 100, 100, 0.04);
            box-shadow: inset 0 4px 30px rgba(0, 0, 0, 0.3);
            position: relative;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .character-big {
            font-size: 8rem;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            filter: drop-shadow(0 10px 40px rgba(255, 50, 50, 0.2));
            transition: all 0.1s ease;
        }

        .character-big .sword-big {
            font-size: 5rem;
            display: inline-block;
            transform-origin: bottom center;
            transition: all 0.05s ease;
        }

        .character-big .sword-big.swing {
            animation: swordBigSwing 0.15s ease;
        }

        @keyframes swordBigSwing {
            0% { transform: rotate(-40deg) scale(1); }
            50% { transform: rotate(35deg) scale(1.4); }
            100% { transform: rotate(-40deg) scale(1); }
        }

        .character-big .sword-big.slash {
            animation: swordBigSlash 0.25s ease;
        }

        @keyframes swordBigSlash {
            0% { transform: rotate(-40deg) scale(1); opacity: 1; }
            40% { transform: rotate(70deg) scale(1.6); opacity: 1; }
            100% { transform: rotate(-40deg) scale(1); opacity: 0.6; }
        }

        .character-big.dash-char {
            animation: charBigDash 0.35s ease;
        }

        @keyframes charBigDash {
            0% { transform: translateX(0) scale(1); }
            30% { transform: translateX(40px) scale(1.15); }
            70% { transform: translateX(-15px) scale(0.92); }
            100% { transform: translateX(0) scale(1); }
        }

        .character-big.hit-char {
            animation: charBigHit 0.45s ease;
        }

        @keyframes charBigHit {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-20px) rotate(-5deg); }
            40% { transform: translateX(20px) rotate(5deg); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
        }

        .character-big.jump-char {
            animation: charBigJump 0.6s ease;
        }

        @keyframes charBigJump {
            0% { transform: translateY(0) scale(1); }
            30% { transform: translateY(-50px) scale(1.2); }
            60% { transform: translateY(-20px) scale(0.9); }
            100% { transform: translateY(0) scale(1); }
        }

        .char-name-big {
            color: #ff6b6b;
            font-weight: 700;
            font-size: 1.1rem;
            margin-top: 6px;
            text-shadow: 0 0 30px rgba(255, 50, 50, 0.1);
        }

        .char-level-big {
            color: #8a6b6b;
            font-size: 0.85rem;
        }
        .char-level-big span {
            color: #ffd700;
            font-weight: 600;
        }

        /* ===== GLASS TARGET ===== */
        .glass-target {
            display: flex;
            gap: 6px;
            justify-content: center;
            padding: 8px 0;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .glass {
            width: 34px;
            height: 42px;
            background: rgba(100, 200, 255, 0.06);
            border: 2px solid rgba(100, 200, 255, 0.12);
            border-radius: 6px 6px 12px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.55rem;
            color: rgba(100, 200, 255, 0.12);
            transition: all 0.3s ease;
            position: relative;
            box-shadow: inset 0 -8px 16px rgba(100, 200, 255, 0.02);
        }

        .glass .glass-num {
            font-size: 0.5rem;
            color: rgba(100, 200, 255, 0.1);
            font-weight: 700;
        }

        .glass.broken {
            background: rgba(255, 50, 50, 0.08);
            border-color: rgba(255, 50, 50, 0.15);
            animation: glassBreak 0.4s ease forwards;
        }

        .glass.broken .glass-num {
            color: rgba(255, 50, 50, 0.2);
        }

        .glass.shattered {
            opacity: 0;
            transform: scale(0.2) rotate(30deg);
            border-color: transparent;
        }

        @keyframes glassBreak {
            0% { transform: scale(1); border-color: rgba(255, 50, 50, 0.2); }
            30% { transform: scale(1.15); border-color: rgba(255, 200, 100, 0.4); }
            60% { transform: scale(0.8) rotate(8deg); }
            100% { transform: scale(0.95); }
        }

        /* ===== SENTENCE ===== */
        #sentenceDisplay {
            font-size: 1.3rem;
            line-height: 2.2rem;
            color: #e8edff;
            font-weight: 400;
            letter-spacing: 0.5px;
            width: 100%;
            word-break: break-word;
            font-family: 'Noto Naskh Arabic', 'Inter', sans-serif;
            padding: 10px 4px 6px;
            min-height: 50px;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            margin-top: 6px;
            text-align: center;
        }
        #sentenceDisplay .correct {
            color: #34d399;
            text-shadow: 0 0 20px rgba(52, 211, 153, 0.15);
        }
        #sentenceDisplay .wrong {
            color: #ff4444;
            background: rgba(255, 0, 0, 0.04);
            border-radius: 4px;
            padding: 0 2px;
            text-decoration: underline wavy #ff4444;
        }
        #sentenceDisplay .cursor {
            display: inline-block;
            width: 3px;
            height: 1.8rem;
            background: #ff6b6b;
            margin-right: 2px;
            border-radius: 3px;
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
            box-shadow: 0 0 20px rgba(255, 50, 50, 0.2);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ===== COMBO / DAMAGE on character ===== */
        .combo-on-char {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
            position: absolute;
            top: 10px;
            left: 20px;
            opacity: 0;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }
        .combo-on-char.active {
            opacity: 1;
            animation: comboPop 0.3s ease;
        }
        @keyframes comboPop {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); color: #ff6b6b; }
        }

        .damage-on-char {
            font-size: 3.5rem;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 50px rgba(255, 215, 0, 0.3);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            pointer-events: none;
            font-family: 'Inter', sans-serif;
        }
        .damage-on-char.active {
            animation: dmgBigFloat 0.8s ease forwards;
        }
        @keyframes dmgBigFloat {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.3); }
            40% { opacity: 1; transform: translate(-50%, -70%) scale(1.4); }
            100% { opacity: 0; transform: translate(-50%, -110%) scale(1); }
        }

        /* ===== PROGRESS BAR ===== */
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            margin-top: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff4444, #ff6b6b, #ffd700);
            border-radius: 10px;
            transition: width 0.4s ease;
            width: 0%;
            box-shadow: 0 0 20px rgba(255, 50, 50, 0.15);
        }

        /* ===== INPUT ===== */
        #userInput {
            width: 100%;
            padding: 14px 22px;
            font-size: 1.1rem;
            border-radius: 60px;
            border: 2px solid rgba(255, 100, 100, 0.06);
            background: rgba(0, 0, 0, 0.4);
            color: #f0f4ff;
            outline: none;
            transition: all 0.3s ease;
            direction: ltr;
            text-align: right;
            letter-spacing: 0.5px;
            font-weight: 500;
            font-family: 'Noto Naskh Arabic', 'Inter', sans-serif;
        }
        #userInput:focus {
            border-color: #ff6b6b;
            box-shadow: 0 0 0 8px rgba(255, 50, 50, 0.05);
            background: rgba(0, 0, 0, 0.55);
        }
        #userInput::placeholder {
            color: #3e3a5a;
            font-weight: 400;
        }
        #userInput:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        /* ===== BUTTONS ===== */
        .actions {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 10px 28px;
            border-radius: 60px;
            border: none;
            font-size: 0.9rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-start {
            background: linear-gradient(135deg, #ff6b6b, #cc0000);
            color: #fff;
            box-shadow: 0 6px 24px rgba(255, 50, 50, 0.2);
        }
        .btn-start:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 10px 36px rgba(255, 50, 50, 0.3);
        }
        .btn-start:active { transform: scale(0.96); }
        .btn-reset {
            background: rgba(255, 120, 120, 0.06);
            color: #ffbcbc;
            border: 1px solid rgba(255, 120, 120, 0.08);
        }
        .btn-reset:hover {
            background: rgba(255, 80, 80, 0.12);
            border-color: rgba(255, 120, 120, 0.15);
        }

        /* ===== STATUS ===== */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
            padding: 6px 14px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 40px;
            border: 1px solid rgba(255, 100, 100, 0.03);
        }
        .status-text {
            color: #8a6b6b;
            font-size: 0.7rem;
            font-weight: 500;
        }
        .status-text strong {
            color: #ff6b6b;
        }

        .mode-btns, .sub-mode-btns, .count-btns {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
        }
        .mode-btn, .sub-mode-btn, .count-btn {
            padding: 3px 10px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: transparent;
            color: #6a6a8a;
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }
        .mode-btn.active, .sub-mode-btn.active, .count-btn.active {
            background: #ff6b6b;
            color: #0a0e1a;
            border-color: #ff6b6b;
        }
        .mode-btn:hover:not(.active), .sub-mode-btn:hover:not(.active), .count-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.04);
            color: #b3b3c7;
        }
        .sub-mode-btn.active, .count-btn.active {
            background: rgba(255, 100, 100, 0.15);
            color: #ff6b6b;
            border-color: rgba(255, 100, 100, 0.12);
        }

        .level-up {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 60px rgba(255, 215, 0, 0.4);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            animation: levelUpAnim 1.5s ease forwards;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px 60px;
            border-radius: 40px;
            border: 2px solid rgba(255, 215, 0, 0.15);
        }
        @keyframes levelUpAnim {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
            80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.4); }
        }

        .particle {
            position: fixed;
            pointer-events: none;
            font-size: 1.5rem;
            animation: particleFly 0.9s ease forwards;
            z-index: 50;
        }
        @keyframes particleFly {
            0% { opacity: 1; transform: translate(0, 0) scale(1) rotate(0deg); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0) rotate(360deg); }
        }

        .glass-fragment {
            position: fixed;
            pointer-events: none;
            width: 12px;
            height: 12px;
            background: rgba(100, 200, 255, 0.12);
            border-radius: 2px;
            animation: glassFragFly 0.7s ease forwards;
            z-index: 40;
        }
        @keyframes glassFragFly {
            0% { opacity: 1; transform: translate(0, 0) rotate(0deg); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) rotate(720deg); }
        }


        /* ===== NINJA BATTLE UPGRADE ===== */
        .character-area {
            min-height: 260px;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 70%, rgba(255,65,65,.10), transparent 32%),
                linear-gradient(180deg, rgba(8,10,18,.9), rgba(22,7,10,.65));
        }

        .ninja-wrap {
            position: relative;
            width: min(520px, 92%);
            height: 145px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
            z-index: 3;
        }

        .ninja {
            position: relative;
            width: 105px;
            height: 125px;
            filter: drop-shadow(0 15px 22px rgba(0,0,0,.65));
            transform-origin: 50% 90%;
            transition: transform .08s ease;
        }

        .ninja-head {
            position: absolute;
            top: -6px;
            left: 7px;
            font-size: 5.6rem;
            line-height: 1;
            z-index: 2;
        }

        .ninja-body {
            position: absolute;
            width: 64px;
            height: 78px;
            left: 20px;
            top: 48px;
            border-radius: 45% 45% 20% 20%;
            background: linear-gradient(135deg, #151a27, #05070c 70%);
            border: 2px solid rgba(255,255,255,.08);
            box-shadow: inset 0 0 18px rgba(255,60,60,.08);
        }

        .ninja-body::before,
        .ninja-body::after {
            content: "";
            position: absolute;
            width: 14px;
            height: 62px;
            background: #080b12;
            border-radius: 20px;
            top: 35px;
        }
        .ninja-body::before { left: -12px; transform: rotate(28deg); }
        .ninja-body::after { right: -12px; transform: rotate(-28deg); }

        .ninja-shadow {
            position: absolute;
            bottom: 0;
            width: 150px;
            height: 20px;
            border-radius: 50%;
            background: rgba(0,0,0,.6);
            filter: blur(7px);
        }

        .sword-big {
            position: relative;
            z-index: 4;
            font-size: 5rem;
            display: inline-block;
            transform-origin: 20% 85%;
            filter: drop-shadow(0 0 16px rgba(180,220,255,.25));
        }

        .sword-big.swing {
            animation: ninjaSlash .13s cubic-bezier(.2,.8,.2,1);
        }
        .sword-big.slash {
            animation: ninjaFinisher .28s cubic-bezier(.15,.8,.2,1);
        }

        @keyframes ninjaSlash {
            0% { transform: rotate(-65deg) translateY(5px) scale(.9); }
            55% { transform: rotate(25deg) translateY(-8px) scale(1.18); }
            100% { transform: rotate(-35deg) translateY(0) scale(1); }
        }

        @keyframes ninjaFinisher {
            0% { transform: rotate(-70deg) translateX(0) scale(.85); }
            35% { transform: rotate(75deg) translateX(30px) scale(1.55); }
            55% { transform: rotate(90deg) translateX(48px) scale(1.65); }
            100% { transform: rotate(-45deg) translateX(0) scale(1); }
        }

        .ninja-hit {
            animation: ninjaHit .18s ease;
        }
        @keyframes ninjaHit {
            0% { transform: translateX(0); }
            30% { transform: translateX(12px) rotate(5deg); }
            65% { transform: translateX(-9px) rotate(-4deg); }
            100% { transform: translateX(0); }
        }

        .target-dummy {
            position: absolute;
            right: 9%;
            bottom: 34px;
            width: 92px;
            height: 92px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 3.8rem;
            background: radial-gradient(circle, rgba(255,80,80,.18), rgba(255,80,80,.02) 65%, transparent 70%);
            border: 2px dashed rgba(255,90,90,.20);
            transition: transform .16s ease, opacity .16s ease, filter .16s ease;
            z-index: 2;
        }

        .target-dummy.hit {
            animation: targetHit .2s ease;
            filter: drop-shadow(0 0 24px rgba(255,70,70,.8));
        }

        @keyframes targetHit {
            0% { transform: scale(1) rotate(0); }
            45% { transform: scale(1.35) rotate(8deg); }
            100% { transform: scale(1) rotate(0); }
        }

        .target-dummy.word-break {
            animation: targetBreak .5s ease forwards;
        }

        @keyframes targetBreak {
            0% { opacity: 1; transform: scale(1); }
            35% { opacity: 1; transform: scale(1.35) rotate(-8deg); }
            100% { opacity: 0; transform: scale(.1) rotate(40deg); }
        }

        .word-target {
            margin: 3px auto 4px;
            width: fit-content;
            min-width: 150px;
            padding: 4px 13px;
            border-radius: 999px;
            color: #ffb4b4;
            background: rgba(255,65,65,.06);
            border: 1px solid rgba(255,100,100,.10);
            font-size: .72rem;
            font-weight: 700;
        }

        .word-done {
            animation: wordDone .25s ease;
        }
        @keyframes wordDone {
            50% { color: #ffd700; transform: scale(1.08); }
        }

        .slash-line {
            position: fixed;
            width: 170px;
            height: 5px;
            border-radius: 999px;
            background: linear-gradient(90deg, transparent, #fff, #8ed8ff, transparent);
            box-shadow: 0 0 22px #8ed8ff;
            pointer-events: none;
            z-index: 90;
            animation: slashLine .22s ease forwards;
            transform: rotate(-18deg);
        }
        @keyframes slashLine {
            0% { opacity: 0; transform: translateX(-50px) rotate(-18deg) scaleX(.2); }
            35% { opacity: 1; transform: translateX(0) rotate(-18deg) scaleX(1); }
            100% { opacity: 0; transform: translateX(70px) rotate(-18deg) scaleX(.5); }
        }

        @media (max-width: 650px) {
            .ninja-wrap { gap: 12px; transform: scale(.62); }
            .target-dummy { right: 3%; font-size: 2.8rem; width: 65px; height: 65px; }
        }


        /* ===== COMPACT FULL-VIEWPORT MODE ===== */
        html, body {
            min-height: 100%;
            overflow-x: hidden;
        }
        body {
            padding: 8px 10px !important;
        }
        .container {
            max-width: 980px !important;
            min-height: 0 !important;
            height: calc(100vh - 16px);
            margin: 0 auto !important;
            display: flex;

        /* ===== MOVING NINJA ===== */
        .ninja-wrap { animation: ninjaIdle 1.1s ease-in-out infinite; }
        @keyframes ninjaIdle {
            0%, 100% { transform: translate3d(-5px, 2px, 0) scale(.72) rotate(-1deg); }
            50% { transform: translate3d(5px, -4px, 0) scale(.72) rotate(1deg); }
        }
        .ninja.move-fast {
            animation: ninjaRun .18s linear infinite;
        }
        @keyframes ninjaRun {
            0% { transform: translateX(-8px) rotate(-3deg); }

        @keyframes ninjaAttack {

            30% { transform: translateX(12px) rotate(8deg) scale(1.06); }

        .target-dummy {

        .target-dummy.word-break {

        @keyframes targetBreak {
            0% { opacity: 1; transform: translateY(0) scale(.72) rotate(0); }
            45% { opacity: 1; transform: translateY(-5px) scale(1.05) rotate(12deg); }
            100% { opacity: 0; transform: translateY(4px) scale(.05) rotate(45deg); }

        /* Fast typing = faster ninja */

        @media (max-width: 650px) {

            .character-big .sword-big { font-size: 2.5rem; }
            .character-area { padding: 14px 10px; min-height: 120px; }

            .status-bar { flex-direction: column; align-items: stretch; gap: 4px; }

<body>

    <div class="container">
        <!-- HEADER -->
        <div class="game-header">

            <div class="character-big" id="characterBig">
                <div class="ninja-wrap" id="ninjaWrap"><div class="ninja-shadow"></div><div class="ninja" id="ninjaBig"><div class="ninja-head">🥷</div><div class="ninja-body"></div></div><span class="sword-big" id="swordBig">🗡️</span></div><div class="target-dummy" id="targetDummy"><span>🎯</span></div>
            </div>

        <!-- SENTENCE -->

        <div id="sentenceDisplay">
            <span>👆 کلیک لە «دەستپێکردن» بکە</span>
            <span class="cursor"></span>
        </div>

        <!-- INPUT -->
        <input type="text" id="userInput" placeholder="لێرە بنوسە ..." autocomplete="off" />

        <!-- ACTIONS -->
        <div class="actions">
            <button class="btn btn-start" id="startBtn">⚔️ دەستپێکردن</button>
            <button class="btn btn-reset" id="resetBtn">🔄 دووبارە</button>
        </div>

        <!-- STATUS -->
        <div class="status-bar">
            <span class="status-text" id="statusText">📖 مۆدی وتە — <strong>١٠</strong></span>
            <div style="display:flex; gap:4px; flex-wrap:wrap; align-items:center;">
                <div class="mode-btns">
                    <button class="mode-btn active" data-mode="proverb">📖 وتە</button>
                    <button class="mode-btn" data-mode="story">📚 چیرۆک</button>

                    <button class="sub-mode-btn active" data-submode="mixed">تێکەڵ</button>
                    <button class="sub-mode-btn" data-submode="short">کورت</button>

                    <button class="count-btn active" data-count="10">١٠</button>

                    <button class="count-btn" data-count="50">٥٠</button>
                </div>
            </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ================================================================
            //  DATA
            // ================================================================

            const PROVERBS = [
                "هەوڵ بدە سەرکەوتن لەگەڵتە، بێ هەوڵ ژیان بەفیڕۆ دەچێت",
                "زانیاری هێزە، خوێندن ڕووناکییە، بیرکردنەوە پێشکەوتنە",
                "کات زێڕە، بە باشی بەکاری بهێنە بۆ داهاتوویەکی گەش",
                "خوێندن ڕووناکییە، ڕووناکی ڕێگا دەدۆزێتەوە بۆ سەرکەوتن",
                "بە هەوڵی خۆت بگە بە مەبەست، هیچ کەس شوێنی تۆ ناگرێتەوە",
                "باشی بکە وەک ئاوی زەریا، بەردەوام و بێ تەنگە",
                "دەست بە کار بکە خودا یارمەتیت دەدات، بەوڵە نەکەوێتە خەمەوە",
                "ئیمان دارە بە خۆت، چونکە تۆ توانای زۆرت هەیە",
                "شەرمن نەبە لە فێربوون، هەر کەس لە هەڵەکانی خۆیەوە فێر دەبێت",
                "هەر ڕۆژێک هەوڵێکی نوێ، پێشکەوتن بچوک دەبێتە گۆڕانکاری گەورە"
            ];

            const STORIES = [
                "لە ڕۆژێکی خۆشدا کوڕێکی گەنج بە ناوی زانیار لە گوندێکی شاخاوی ژیان دەکرد. ئەو خەونی ئەوەی دەبینی کە کتێبخانەیەک دروست بکات، باوەڕی وابوو خوێندن ژیان دەگۆڕێت.",
                "کچێک بە ناوی ژین لە گوندێکی دوورەدەست ژیان دەکرد. هەموو ڕۆژێک ڕێگایەکی درێژی دەبڕی بۆ خوێندن. دوای ساڵانێک بووە مامۆستا.",
                "دوو برا بە ناوەکانی ڕێبوار و ڕەهەند لە شارێکی گەورەدا ژیان دەکرد. یەکێکیان خوێندن و ئەوی تر بازرگانی. بە هاوکاری کۆمپانیایەکی گەورەیان دامەزراند.",
                "منداڵێک بە ناوی ئاوات حەزی لە گوێگرتن لە چیرۆکی باپیرەی بوو. بڕیاریدا خۆی چیرۆک بنووسێت. دوای ساڵانێک بووە نووسەرێکی ناسراو.",
                "خەڵکی گوندێکی شاخاوی بە یەکەوە دەژیان. کاتێک زستانێکی سەخت هات، هەموو گوندەکە کۆبوونەوە و مانەوە."
            ];

            const TAPOO_SHORT = [
                "ئەحمەد محەممەد - ٢٢١١٤٣ - شوقە ٤/ب",
                "خەدیجە عەلی - ٣٤٥٦٧ - خانوو ١١٣/أ",
                "محەممەد ساڵح - ٥٦٧٨٩ - گەڕەکی شۆرە",
                "فاتیمە حەسەن - ٧٨٩١٢ - شوقە ١/أ",
                "عەبدولڕەحمان - ٣٢١٤٥ - تەلەعفەر",
                "زەینەب عەلی - ٤٣٢١١ - شوقە ٣/ج",
                "یووسف ئەحمەد - ٥٤٣٢١ - خانوو ٨٥",
                "ڕەحیم سەلمان - ٦٥٤٣٢ - شەقامی نەورۆز",
                "نەجمە حەسەن - ٧٦٥٤٣ - شوقە ٥/ب",
                "محەممەد عەلی - ٨٧٦٥٤ - خانوو ٢٢"
            ];

            const TAPOO_LONG = [
                "پشک دراوە بە ئەحمەد محەممەد بە (٢٢١١٤٣) لە شوقە (٤/ب) بە ناوی فەلاح حەسەن لە گەڕەکی شۆرە",
                "بەڵگەنامەی خانووی ژمارە (١١٣/أ) بە ناوی خەدیجە عەلی بە (٣٤٥٦٧) لە ناوچەی کەرکوک",
                "تۆماری زەوی بە ناوی محەممەد ساڵح بە (٥٦٧٨٩) لە گەڕەکی شۆرە، خانوو بە (٢/ج)",
                "پشک دراوە بە فاتیمە حەسەن بە (٧٨٩١٢) لە شوقە (١/أ) بە بەهای (٢٥٠٠٠٠٠٠) دینار",
                "تاپۆی زەوی بە ناوی عەبدولڕەحمان محەممەد بە (٣٢١٤٥) لە ناحیەی تەلەعفەر",
                "بەڵگەی مەڵک بە ناوی زەینەب عەلی بە (٤٣٢١١) لە شوقە (٣/ج) بە ڕووبەری (١٢٠) مەتر",
                "پشک دراوە بە یووسف ئەحمەد بە (٥٤٣٢١) لە خانووی ژمارە (٨٥) لە گەڕەکی بەکر",
                "تۆماری خانوو بە ناوی ڕەحیم سەلمان بە (٦٥٤٣٢) لە شەقامی نەورۆز، خانوو بە (١٢/أ)",
                "بەڵگەنامەی زەوی بە ناوی نەجمە حەسەن بە (٧٦٥٤٣) لە شوقە (٥/ب) بە (٣٠٠) مەتر",
                "پشک دراوە بە محەممەد عەلی بە (٨٧٦٥٤) لە خانووی ژمارە (٢٢) لە گەڕەکی ئازادی"
            ];

            // ================================================================
            //  DOM REFS
            // ================================================================

            const sentenceDisplay = document.getElementById('sentenceDisplay');
            const userInput = document.getElementById('userInput');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const levelDisplay = document.getElementById('levelDisplay');
            const comboDisplay = document.getElementById('comboDisplay');
            const wpmDisplay = document.getElementById('wpmDisplay');
            const glassDisplay = document.getElementById('glassDisplay');
            const glassCountBig = document.getElementById('glassCountBig');
            const progressFill = document.getElementById('progressFill');
            const glassTarget = document.getElementById('glassTarget');
            const statusText = document.getElementById('statusText');
            const startBtn = document.getElementById('startBtn');
            const resetBtn = document.getElementById('resetBtn');
            const modeBtns = document.querySelectorAll('.mode-btn');
            const subModeBtns = document.querySelectorAll('.sub-mode-btn');
            const subModeContainer = document.getElementById('subModeContainer');
            const countBtns = document.querySelectorAll('.count-btn');

            // Character elements
            const charBigEmoji = document.getElementById('charBigEmoji');
            const swordBig = document.getElementById('swordBig');
            const ninjaBig = document.getElementById('ninjaBig');
            const targetDummy = document.getElementById('targetDummy');
            const wordTarget = document.getElementById('wordTarget');
            const charNameBig = document.getElementById('charNameBig');
            const charLevelBig = document.getElementById('charLevelBig');
            const characterBig = document.getElementById('characterBig');
            const comboOnChar = document.getElementById('comboOnChar');
            const damageOnChar = document.getElementById('damageOnChar');

            // ================================================================
            //  STATE
            // ================================================================

            let currentMode = 'proverb';
            let currentSubMode = 'mixed';
            let maxCount = 10;

            let activeList = [];
            let currentSentence = '';
            let sentenceIndex = 0;
            let charIndex = 0;

            let isActive = false;
            let startTime = null;
            let timerInterval = null;

            let totalCharsTyped = 0;
            let correctCharsTyped = 0;

            let score = 0;
            let level = 1;
            let combo = 0;
            let maxCombo = 0;
            let sentencesCompleted = 0;
            let glassesBroken = 0;
            let totalGlasses = 10;

            // ================================================================
            //  HELPERS
            // ================================================================

            function getFullList() {
                if (currentMode === 'proverb') return PROVERBS;
                if (currentMode === 'story') return STORIES;
                if (currentSubMode === 'short') return TAPOO_SHORT;
                if (currentSubMode === 'long') return TAPOO_LONG;
                const combined = [];
                const maxLen = Math.max(TAPOO_SHORT.length, TAPOO_LONG.length);
                for (let i = 0; i < maxLen; i++) {
                    if (i < TAPOO_SHORT.length) combined.push(TAPOO_SHORT[i]);
                    if (i < TAPOO_LONG.length) combined.push(TAPOO_LONG[i]);
                }
                return combined;
            }

            function buildActiveList() {
                const full = getFullList();
                activeList = full.slice(0, Math.min(maxCount, full.length));
                if (activeList.length === 0) activeList = ['هیچ بەڵگەیەک نیە'];
                totalGlasses = Math.min(activeList.length, 30);
                return activeList;
            }

            function getModeLabel() {
                if (currentMode === 'proverb') return 'وتە';
                if (currentMode === 'story') return 'چیرۆک';
                return 'تاپۆ';
            }

            function getCharacterEmoji() {
                const chars = ['🥷', '⚔️', '🗡️', '🔥', '⚡', '🐉', '👺', '🥷'];
                return chars[(level - 1) % chars.length];
            }

            function getCharacterName() {
                const names = ['نینجا', 'شینۆبی', 'تایپ مەستەر', 'نینجای خێرا', 'شینۆبی زیرەک', 'قاتڵی وشە', 'سەربازی شەو', 'نینجای بەهێز'];
                return names[(level - 1) % names.length];
            }

            // ================================================================
            //  RENDER FUNCTIONS
            // ================================================================

            function renderSentence() {
                if (!currentSentence) {
                    sentenceDisplay.innerHTML = `<span>هیچ بەڵگەیەک نیە</span><span class="cursor"></span>`;
                    return;
                }
                const chars = currentSentence.split('');
                let html = '';
                for (let i = 0; i < chars.length; i++) {
                    if (i < charIndex) {
                        html += `<span data-idx="${i}">${chars[i]}</span>`;
                    } else if (i === charIndex) {
                        html += `<span data-idx="${i}">${chars[i]}</span><span class="cursor"></span>`;
                    } else {
                        html += `<span data-idx="${i}">${chars[i]}</span>`;
                    }
                }
                if (charIndex >= chars.length) {
                    html += `<span class="cursor"></span>`;
                }
                sentenceDisplay.innerHTML = html;
                applyStyles();
                updateWordTarget();
            }

            function applyStyles() {
                const input = userInput.value;
                const chars = currentSentence.split('');
                const spans = sentenceDisplay.querySelectorAll('span[data-idx]');
                spans.forEach(span => span.classList.remove('correct', 'wrong'));
                for (let i = 0; i < input.length && i < chars.length; i++) {
                    const span = sentenceDisplay.querySelector(`span[data-idx="${i}"]`);
                    if (!span) continue;
                    if (input[i] === chars[i]) {
                        span.classList.add('correct');
                    } else {
                        span.classList.add('wrong');
                    }
                }
            }

            function renderGlasses() {
                glassTarget.innerHTML = '';
                const total = Math.min(totalGlasses, 30);
                for (let i = 0; i < total; i++) {
                    const glass = document.createElement('div');
                    glass.className = 'glass';
                    if (i < glassesBroken) {
                        glass.classList.add('broken');
                        if (i < glassesBroken - 2) {
                            glass.classList.add('shattered');
                        }
                    }
                    glass.dataset.index = i;
                    const num = document.createElement('span');
                    num.className = 'glass-num';
                    num.textContent = i + 1;
                    glass.appendChild(num);
                    glassTarget.appendChild(glass);
                }
                glassDisplay.textContent = glassesBroken;
                glassCountBig.textContent = glassesBroken;
            }

            function updateDisplay() {
                const elapsed = startTime ? (Date.now() - startTime) / 1000 : 0;
                if (elapsed > 0 && correctCharsTyped > 0) {
                    const minutes = elapsed / 60;
                    const wpm = Math.round((correctCharsTyped / 5) / minutes);
                    wpmDisplay.textContent = wpm;
                } else {
                    wpmDisplay.textContent = '0';
                }

                scoreDisplay.textContent = score;
                levelDisplay.textContent = level;
                comboDisplay.textContent = combo;

                // Update character
                charBigEmoji.textContent = getCharacterEmoji();
                charNameBig.textContent = `🥷 ${getCharacterName()}`;
                charLevelBig.textContent = level;

                // Update combo on character
                if (combo > 0) {
                    comboOnChar.textContent = `🔥 x${combo}`;
                    comboOnChar.classList.add('active');
                } else {
                    comboOnChar.textContent = '🔥 x0';
                    comboOnChar.classList.remove('active');
                }

                const total = activeList.length;
                const progress = total > 0 ? (sentencesCompleted / total) * 100 : 0;
                progressFill.style.width = Math.min(progress, 100) + '%';

                const label = getModeLabel();
                const count = activeList.length;
                let extra = currentMode === 'tapoo' ? ` (${currentSubMode === 'short' ? 'کورت' : currentSubMode === 'long' ? 'درێژ' : 'تێکەڵ'})` : '';
                statusText.innerHTML = `${currentMode === 'proverb' ? '📖' : currentMode === 'story' ? '📚' : '📜'} مۆدی ${label}${extra} — <strong>${count}</strong>`;

                renderGlasses();
            }

            // ================================================================
            //  SWORD & CHARACTER ANIMATIONS
            // ================================================================

            function ninjaAttackMotion() {
                ninjaBig.classList.remove('attack');
                void ninjaBig.offsetWidth;
                ninjaBig.classList.add('attack');
                setTimeout(() => ninjaBig.classList.remove('attack'), 220);
            }

            function swingSword() {
                swordBig.classList.remove('swing', 'slash');
                ninjaBig.classList.remove('ninja-hit');
                void swordBig.offsetWidth;
                swordBig.classList.add('swing');
                ninjaAttackMotion();
                targetDummy.classList.remove('hit');
                void targetDummy.offsetWidth;
                targetDummy.classList.add('hit');
                setTimeout(() => {
                    swordBig.classList.remove('swing');
                    targetDummy.classList.remove('hit');
                }, 180);
                spawnSlashLine();
            }

            function slashSword() {
                swordBig.classList.remove('swing', 'slash');
                void swordBig.offsetWidth;
                swordBig.classList.add('slash');
                ninjaAttackMotion();
                targetDummy.classList.remove('hit');
                void targetDummy.offsetWidth;
                targetDummy.classList.add('hit');
                setTimeout(() => {
                    swordBig.classList.remove('slash');
                    targetDummy.classList.remove('hit');
                }, 300);
                spawnSlashLine();
            }

            function spawnSlashLine() {
                const rect = targetDummy.getBoundingClientRect();
                const el = document.createElement('div');
                el.className = 'slash-line';
                el.style.left = (rect.left - 55) + 'px';
                el.style.top = (rect.top + rect.height / 2) + 'px';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 260);
            }

            function dashChar() {
                characterBig.classList.remove('dash-char', 'hit-char', 'jump-char');
                void characterBig.offsetWidth;
                characterBig.classList.add('dash-char');
                setTimeout(() => characterBig.classList.remove('dash-char'), 350);
            }

            function hitChar() {
                characterBig.classList.remove('dash-char', 'hit-char', 'jump-char');
                void characterBig.offsetWidth;
                characterBig.classList.add('hit-char');
                setTimeout(() => characterBig.classList.remove('hit-char'), 450);
            }

            function jumpChar() {
                characterBig.classList.remove('dash-char', 'hit-char', 'jump-char');
                void characterBig.offsetWidth;
                characterBig.classList.add('jump-char');
                setTimeout(() => characterBig.classList.remove('jump-char'), 600);
            }

            function showDamageOnChar(dmg) {
                damageOnChar.textContent = `💥 +${dmg}`;
                damageOnChar.classList.remove('active');
                void damageOnChar.offsetWidth;
                damageOnChar.classList.add('active');
                setTimeout(() => damageOnChar.classList.remove('active'), 800);
            }

            function spawnParticles(x, y, count = 12) {
                const emojis = ['⚔️', '🗡️', '✨', '⚡', '💥', '🔥', '⭐', '🌟'];
                for (let i = 0; i < count; i++) {
                    const el = document.createElement('div');
                    el.className = 'particle';
                    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    el.style.left = (x || window.innerWidth / 2) + 'px';
                    el.style.top = (y || window.innerHeight / 2) + 'px';
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 50 + Math.random() * 200;
                    el.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
                    el.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
                    el.style.fontSize = (1 + Math.random() * 2) + 'rem';
                    document.body.appendChild(el);
                    setTimeout(() => el.remove(), 900);
                }
            }

            function spawnGlassFragments(x, y, count = 15) {
                for (let i = 0; i < count; i++) {
                    const el = document.createElement('div');
                    el.className = 'glass-fragment';
                    el.style.left = (x || window.innerWidth / 2) + 'px';
                    el.style.top = (y || window.innerHeight / 2) + 'px';
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 40 + Math.random() * 200;
                    el.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
                    el.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
                    el.style.background = `rgba(${100 + Math.random()*155}, ${200 + Math.random()*55}, 255, ${0.08 + Math.random()*0.15})`;
                    document.body.appendChild(el);
                    setTimeout(() => el.remove(), 800);
                }
            }

            function showLevelUp() {
                const el = document.createElement('div');
                el.className = 'level-up';
                el.textContent = `🥷 ئاست ${level} 🗡️`;
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 1600);
                spawnParticles(window.innerWidth / 2, window.innerHeight / 2, 30);
                jumpChar();
            }

            function breakWord() {
                animateWordBreak();
                slashSword();
                jumpChar();

                const dmg = 8 + (combo * 2);
                showDamageOnChar(dmg);
                score += dmg;
                combo++;
                if (combo > maxCombo) maxCombo = combo;
                updateDisplay();

                wordTarget.classList.remove('word-done');
                void wordTarget.offsetWidth;
                wordTarget.classList.add('word-done');
                setTimeout(() => wordTarget.classList.remove('word-done'), 260);
            }

            function breakGlass() {
                if (glassesBroken >= totalGlasses) return;
                glassesBroken++;
                renderGlasses();

                slashSword();
                jumpChar();

                const glasses = glassTarget.querySelectorAll('.glass');
                if (glasses.length > glassesBroken - 1) {
                    const glassEl = glasses[glassesBroken - 1];
                    const rect = glassEl.getBoundingClientRect();
                    spawnGlassFragments(rect.left + rect.width / 2, rect.top + rect.height / 2, 15);
                }

                const dmg = 10 + (combo * 2);
                showDamageOnChar(dmg);
                score += dmg;

                combo++;
                if (combo > maxCombo) maxCombo = combo;

                updateDisplay();

                if (glassesBroken >= totalGlasses) {
                    level++;
                    totalGlasses = Math.min(totalGlasses + 5, 30);
                    glassesBroken = 0;
                    showLevelUp();
                    renderGlasses();
                    updateDisplay();
                }
            }

            function getWordBoundaries(text) {
                const words = [];
                const re = /\S+/gu;
                let m;
                while ((m = re.exec(text)) !== null) {
                    words.push({ start: m.index, end: m.index + m[0].length, text: m[0] });
                }
                return words;
            }

            function getCurrentWord() {
                const words = getWordBoundaries(currentSentence);
                return words.find(w => charIndex < w.end) || words[words.length - 1] || null;
            }

            function updateWordTarget() {
                const word = getCurrentWord();
                if (!word) {
                    wordTarget.textContent = '🏆 تەواو';
                    return;
                }
                const typed = Math.max(0, Math.min(charIndex - word.start, word.text.length));
                const remaining = word.text.slice(typed);
                wordTarget.textContent = remaining ? `🎯 ${remaining}` : '⚡ ئامادەی وشەی داهاتوو';
            }

            function animateWordBreak() {
                targetDummy.classList.remove('word-break');
                void targetDummy.offsetWidth;
                targetDummy.classList.add('word-break');
                spawnGlassFragments(
                    targetDummy.getBoundingClientRect().left + targetDummy.offsetWidth / 2,
                    targetDummy.getBoundingClientRect().top + targetDummy.offsetHeight / 2,
                    22
                );
                setTimeout(() => {
                    targetDummy.classList.remove('word-break');
                    targetDummy.style.opacity = '1';
                }, 520);
            }

            // ================================================================
            //  GAME LOGIC
            // ================================================================

            function loadSentence(index) {
                if (index >= activeList.length) {
                    finishGame();
                    return;
                }
                sentenceIndex = index;
                currentSentence = activeList[index];
                charIndex = 0;
                totalCharsTyped = 0;
                correctCharsTyped = 0;

                userInput.value = '';
                userInput.disabled = false;
                renderSentence();
                updateDisplay();
            }

            function finishGame() {
                stopTimer();
                isActive = false;
                userInput.disabled = true;
                sentenceDisplay.innerHTML = `
                    <span style="color: #ffd700; font-weight: 700; font-size: 1.6rem;">
                        🏆 تەواو! خاڵ: ${score} | ئاست: ${level} | شوشە: ${glassesBroken}
                    </span>
                    <span class="cursor"></span>
                `;
                statusText.innerHTML = '🏁 تەواو! دووبارە دەستپێبکە';
                charBigEmoji.textContent = '🏆';
                spawnParticles(window.innerWidth / 2, window.innerHeight / 2, 35);
                updateDisplay();
            }

            function startGame() {
                if (isActive) return;
                buildActiveList();
                if (activeList.length === 0) return;
                if (sentenceIndex >= activeList.length) sentenceIndex = 0;
                if (!currentSentence || sentenceIndex >= activeList.length) loadSentence(0);

                score = 0;
                level = 1;
                combo = 0;
                maxCombo = 0;
                sentencesCompleted = 0;
                glassesBroken = 0;
                totalGlasses = Math.min(activeList.length, 30);

                isActive = true;
                userInput.disabled = false;
                userInput.value = '';
                userInput.focus();

                totalCharsTyped = 0;
                correctCharsTyped = 0;
                charIndex = 0;

                currentSentence = activeList[sentenceIndex];
                renderSentence();
                startTimer();
                updateDisplay();
                renderGlasses();
            }

            function resetGame() {
                stopTimer();
                isActive = false;
                startTime = null;

                score = 0;
                level = 1;
                combo = 0;
                maxCombo = 0;
                sentencesCompleted = 0;
                glassesBroken = 0;
                totalGlasses = 10;

                buildActiveList();
                if (activeList.length === 0) activeList = ['هیچ بەڵگەیەک نیە'];
                sentenceIndex = 0;
                loadSentence(0);

                userInput.disabled = false;
                userInput.value = '';
                updateDisplay();
                comboOnChar.classList.remove('active');
                userInput.focus();
                renderGlasses();
            }

            function completeSentence() {
                sentencesCompleted++;
                updateDisplay();

                if (sentenceIndex + 1 < activeList.length) {
                    setTimeout(() => {
                        loadSentence(sentenceIndex + 1);
                        if (isActive) userInput.focus();
                    }, 350);
                } else {
                    setTimeout(finishGame, 500);
                }
            }

            // ================================================================
            //  TIMER
            // ================================================================

            function startTimer() {
                if (timerInterval) stopTimer();
                startTime = Date.now();
                timerInterval = setInterval(() => {
                    if (startTime) updateDisplay();
                }, 200);
            }

            function stopTimer() {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
                startTime = null;
            }

            // ================================================================
            //  INPUT HANDLER
            // ================================================================

            function handleInput(e) {
                if (!isActive) {
                    startGame();
                    if (!isActive) return;
                }

                const input = userInput.value;
                const chars = currentSentence.split('');
                const typedLen = Math.min(input.length, chars.length);

                const lastChar = input.length > 0 ? input[input.length - 1] : '';
                if (lastChar) {
                    const idx = input.length - 1;
                    if (idx < chars.length) {
                        const isCorrect = lastChar === chars[idx];

                        if (isCorrect) {
                            // هەر پیتێکی ڕاست = شمشێر دەجوڵێت + کارەکتەر باز دەدات
                            swingSword();
                            dashChar();
                        } else {
                            combo = 0;
                            comboOnChar.textContent = '💔 شکا!';
                            comboOnChar.classList.add('active');
                            setTimeout(() => {
                                comboOnChar.classList.remove('active');
                                comboOnChar.textContent = '🔥 x0';
                            }, 600);
                            hitChar();
                        }
                    }
                }

                totalCharsTyped = typedLen;
                let correctCount = 0;
                for (let i = 0; i < typedLen; i++) {
                    if (input[i] === chars[i]) correctCount++;
                }
                correctCharsTyped = correctCount;
                const previousCharIndex = charIndex;
                ninjaAttackMotion();
                charIndex = Math.min(input.length, chars.length);

                // Every completed word triggers a ninja finishing slash.
                const words = getWordBoundaries(currentSentence);
                for (const word of words) {
                    if (previousCharIndex < word.end && charIndex >= word.end) {
                        breakWord();
                    }
                }

                renderSentence();
                updateDisplay();

                if (input.length >= chars.length && correctCount === chars.length) {
                    // Final glass smash: finishing the whole sentence.
                    breakGlass();
                    setTimeout(() => {
                        if (isActive) {
                            completeSentence();
                        }
                    }, 250);
                }
            }

            // ================================================================
            //  MODE / COUNT / SUBMODE CHANGE
            // ================================================================

            function setMode(mode) {
                if (mode === currentMode) return;
                currentMode = mode;
                modeBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));
                subModeContainer.style.display = mode === 'tapoo' ? 'flex' : 'none';
                resetGame();
            }

            function setSubMode(submode) {
                if (submode === currentSubMode) return;
                currentSubMode = submode;
                subModeBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.submode === submode));
                resetGame();
            }

            function setCount(count) {
                if (count === maxCount) return;
                maxCount = count;
                countBtns.forEach(btn => btn.classList.toggle('active', parseInt(btn.dataset.count) === count));
                resetGame();
            }

            // ================================================================
            //  EVENT LISTENERS
            // ================================================================

            userInput.addEventListener('input', handleInput);
            startBtn.addEventListener('click', startGame);
            resetBtn.addEventListener('click', resetGame);

            modeBtns.forEach(btn => {
                btn.addEventListener('click', function() { setMode(this.dataset.mode); });
            });

            subModeBtns.forEach(btn => {
                btn.addEventListener('click', function() { setSubMode(this.dataset.submode); });
            });

            countBtns.forEach(btn => {
                btn.addEventListener('click', function() { setCount(parseInt(this.dataset.count)); });
            });

            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.key === 'Enter') { e.preventDefault();
                    startGame(); }
                if (e.key === 'Escape') { resetGame(); }
            });

            // ================================================================
            //  INIT
            // ================================================================

            function init() {
                subModeContainer.style.display = 'none';
                buildActiveList();
                if (activeList.length === 0) activeList = ['بەخێربێیت!'];
                loadSentence(0);
                updateDisplay();
                renderGlasses();
                userInput.focus();
                console.log('🥷 شمشێر تایپ - نینجای تایپ!');
                console.log('🗡️ هەر پیتێکی ڕاست = شمشێر دەجوڵێت | هەر وشەیەک = برینی کۆتایی');
                console.log('💎 هەر وشەیەک = ئامانج دەشکێت | کۆتایی ڕستە = فینیشەر');
                console.log('💡 Ctrl+Enter = دەستپێکردن | Esc = دووبارە');
            }

            init();

        })();
    </script>

</body>
</html>
